<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOOPS WARS — Basketball Conference Tycoon</title>
<meta name="description" content="Run a college basketball conference through 30 years of March Madness, NIL money, and betrayal. Court schools, dominate the bracket, build a dynasty.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
<style>
:root{
  --bg:#0d0f1a;--bg2:#131629;--panel:#181d35;--panel2:#1c234066;
  --line:#2a3355;--ink:#e8ecfa;--dim:#8090b8;--faint:#4a5580aa;
  --ora:#f97316;--ora-d:#ea580c;--gold:#fbbf24;--red:#f87171;--green:#4ade80;--blue:#60a5fa;--pink:#f472b6;
  --wood:#d4a853;--court:#c4713a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 70% -10%,#2a1a0a44,transparent 60%),var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:14px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:linear-gradient(180deg,#181d35,#131629);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:2.5px;font-size:17px;white-space:nowrap}
.logo b{color:var(--ora)}
.logo small{display:block;font-size:9px;letter-spacing:3.5px;color:var(--dim);font-weight:600}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px;text-align:center}
.chip .k{font-size:9px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase}
.chip .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.chip .v.ora{color:var(--ora)}.chip .v.gold{color:var(--gold)}.chip .v.green{color:var(--green)}
.spacer{flex:1}
button{font-family:inherit;border:none;border-radius:9px;cursor:pointer;font-weight:700;letter-spacing:.4px;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 14px;transition:filter .12s,transform .05s}
button:hover{filter:brightness(1.18)}button:active{transform:translateY(1px)}
button:disabled{opacity:.38;cursor:not-allowed;filter:none}
.btn-cta{background:linear-gradient(180deg,var(--ora),var(--ora-d));color:#1a0800;font-size:15px;padding:11px 22px;border:none;box-shadow:0 0 18px #ea580c55;letter-spacing:1px}
.btn-gold{background:linear-gradient(180deg,#fbbf24,#d97706);color:#2a1c00;border:none}
.btn-ghost{background:transparent}
.btn-red{background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;border:none}
#main{display:grid;grid-template-columns:296px 1fr 344px;gap:12px;padding:12px 14px;flex:1;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{padding:9px 13px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:8px}
.ph .right{margin-left:auto;letter-spacing:0}
.pb{padding:10px 12px;overflow-y:auto;flex:1;min-height:0}
.pb::-webkit-scrollbar,#news::-webkit-scrollbar{width:8px}
.pb::-webkit-scrollbar-thumb,#news::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
#left{display:flex;flex-direction:column;gap:12px;min-height:0}
#myStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:11px 12px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.stat .k{font-size:9px;letter-spacing:1.2px;color:var(--dim);text-transform:uppercase}
.stat .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .s{font-size:10px;color:var(--dim)}
#tvRow{grid-column:1/-1;display:flex;align-items:center;gap:10px}
#tvRow .bar{flex:1;height:6px;background:var(--faint);border-radius:3px;overflow:hidden}
#tvRow .bar i{display:block;height:100%;background:var(--gold)}
#memberList{display:flex;flex-direction:column;gap:5px}
.mem{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid transparent;border-radius:8px;padding:6px 9px;cursor:pointer}
.mem:hover{border-color:var(--ora)}
.mem .ab{font-weight:800;width:38px;font-size:12px}
.mem .nm{flex:1;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .mood{width:52px;height:5px;background:var(--faint);border-radius:3px;overflow:hidden}
.mem .mood i{display:block;height:100%}
.mem .br{font-size:10.5px;color:var(--dim);width:26px;text-align:right;font-variant-numeric:tabular-nums}
#center{display:flex;flex-direction:column;gap:12px;min-height:0}
#mapPanel{flex:1;min-height:0;position:relative}
#mapPanel svg{width:100%;height:100%;display:block;cursor:grab}
#mapPanel svg.dragging{cursor:grabbing}
#tip{position:absolute;pointer-events:none;background:#0d0f1af2;border:1px solid var(--ora);border-radius:9px;padding:9px 11px;font-size:11.5px;display:none;z-index:30;min-width:170px;box-shadow:0 6px 24px #0009}
#tip .t{font-weight:800;font-size:13px}
#tip .c{color:var(--dim);margin-bottom:5px}
#tip .row{display:flex;justify-content:space-between;gap:14px}
#tip .row span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
#standings{height:200px;flex:none}
#standTable{width:100%;border-collapse:collapse;font-size:11.5px}
#standTable td{padding:3.5px 6px;border-bottom:1px solid #2a335555;font-variant-numeric:tabular-nums;white-space:nowrap}
#standTable td.cn{font-weight:800}
#standTable tr.me td{background:#f9731611}
#right{display:flex;flex-direction:column;gap:12px;min-height:0}
#actionsBody{display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.act{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;cursor:pointer;text-align:left}
.act:hover{border-color:var(--ora);filter:none}
.act .ic{font-size:16px;width:22px;text-align:center}
.act .tx{flex:1}
.act .tt{font-size:12.5px;font-weight:700}
.act .td{font-size:10.5px;color:var(--dim);font-weight:400}
.act .ap{font-size:10px;font-weight:800;color:var(--gold);white-space:nowrap}
#newsPanel{flex:1;min-height:0}
#news{overflow-y:auto;flex:1;min-height:0;padding:9px 10px;display:flex;flex-direction:column;gap:8px}
.nw{display:flex;gap:10px;font-size:13.2px;line-height:1.55;color:#eef4ff;background:#151a30;border-left:3px solid var(--dim);border-radius:0 9px 9px 0;padding:8px 11px;animation:slidein .25s ease}
.nw.poach{border-left-color:var(--red);background:#1a1525}.nw.money{border-left-color:var(--ora)}.nw.event{border-left-color:var(--gold)}.nw.good{border-left-color:var(--green)}.nw.madness{border-left-color:var(--blue);background:#12162a}
.nw b{color:#fff}
.nw .yr{font-size:10.5px;font-weight:800;color:#8090b8;padding-top:3px;font-variant-numeric:tabular-nums;flex:none}
@keyframes slidein{from{opacity:0;transform:translateY(-5px)}to{opacity:1}}
#shade{position:fixed;inset:0;background:#050816dd;display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
#modal{background:linear-gradient(180deg,#1e2548,#181d35);border:1px solid #3a4570;border-radius:15px;max-width:720px;width:92%;max-height:88vh;overflow-y:auto;padding:22px 24px;box-shadow:0 20px 70px #000c}
#modal h2{font-size:19px;letter-spacing:.5px;margin-bottom:4px}
#modal .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
#modal .body{font-size:13px;line-height:1.55}
.mrow{display:flex;justify-content:space-between;gap:16px;padding:6px 2px;border-bottom:1px solid #2a335566;font-size:12.5px}
.mrow span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.odds{font-size:34px;font-weight:900;text-align:center;margin:10px 0 2px}
.oddsLbl{text-align:center;color:var(--dim);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.btnRow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btnRow button{flex:1;min-width:130px;padding:11px 10px}
.pickGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pick{border:1px solid var(--line);border-radius:11px;padding:12px 13px;cursor:pointer;background:var(--bg2);position:relative}
.pick:hover{border-color:var(--ora);box-shadow:0 0 14px #f9731633}
.pick .nm{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:7px}
.pick .nm i{width:10px;height:10px;border-radius:50%}
.pick .meta{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5}
.pick .diff{position:absolute;top:10px;right:11px;font-size:9.5px;letter-spacing:1px;font-weight:800;border-radius:5px;padding:2px 6px}
.diff.easy{background:#14532d;color:#86efac}.diff.med{background:#57420b;color:#fde68a}.diff.hard{background:#5c1a1a;color:#fca5a5}.diff.ext{background:#3b1d5c;color:#d8b4fe}
.grade{font-size:72px;font-weight:900;text-align:center;line-height:1}
.gradeStamp{opacity:0;animation:stamp .8s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stamp{0%{transform:scale(2.8) rotate(-7deg);opacity:0}55%{opacity:1}78%{transform:scale(.94) rotate(0)}100%{transform:scale(1);opacity:1}}
.reveal{opacity:0;animation:rev .55s ease forwards}
@keyframes rev{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.recap{margin-top:12px;max-height:230px;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.6}
.recap b{color:var(--gold)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:-60px;background:var(--panel);border:1px solid var(--ora);color:var(--ink);border-radius:10px;padding:10px 18px;font-size:13px;z-index:80;transition:bottom .3s;box-shadow:0 8px 30px #000a}
#toast.on{bottom:22px}
.dot{cursor:pointer;transition:r .15s}
.moveArc{fill:none;stroke-width:2.4;stroke-dasharray:9 7;stroke-linecap:round;animation:arcdash 1.1s ease-out forwards,arcfade 1.7s ease forwards;pointer-events:none}
.pulseC{animation:pulseK .95s ease-out forwards;pointer-events:none}
@keyframes arcdash{from{stroke-dashoffset:640}to{stroke-dashoffset:0}}
@keyframes arcfade{0%{opacity:0}12%{opacity:.95}75%{opacity:.85}100%{opacity:0}}
@keyframes pulseK{0%{r:5;opacity:.95}100%{r:30;opacity:0}}
.streak{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(90deg,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;font-size:14px;animation:streakPulse 1s ease infinite}
@keyframes streakPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.bracket-match{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin:2px 0;font-size:11.5px;min-width:140px}
.bracket-match .team{display:flex;justify-content:space-between;padding:2px 0}
.bracket-match .team.winner{color:var(--ora);font-weight:800}
.bracket-match .team .seed{color:var(--dim);width:18px;font-size:10px}
.bracket-match .team.mine{background:#f9731611;border-radius:3px}
.bracket-round{display:flex;flex-direction:column;justify-content:space-around;gap:4px;padding:0 4px}
.bracket-wrap{display:flex;align-items:stretch;overflow-x:auto;gap:2px;padding:10px}
.round-label{text-align:center;font-size:9px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;font-weight:700;padding:4px 0}
.confetti{position:fixed;pointer-events:none;z-index:100}
.secLbl{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-weight:800;margin:14px 0 0}
.tgl{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:12px;cursor:pointer;font-size:12.5px}
.tgl input{accent-color:var(--ora);transform:scale(1.2)}
@media(max-width:920px){#app{min-width:1180px}body{overflow:auto}}
.badge{display:inline-block;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:3px;font-size:11px;font-weight:700}
.badge.earned{border-color:var(--ora);color:var(--ora);background:#f9731611}
.nilBar{height:8px;background:var(--faint);border-radius:4px;overflow:hidden;margin:4px 0}
.nilBar i{display:block;height:100%;background:linear-gradient(90deg,var(--ora),var(--gold));border-radius:4px;transition:width .3s}
</style>
</head>

</div>
<div id="shade"><div id="modal"></div></div>

let audioCtx=null;
function initAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function playTone(freq,dur,type,vol){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||"sine";o.frequency.value=freq;g.gain.value=vol||.08;
  o.connect(g);g.connect(audioCtx.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
}
function sfxBuzzer(){playTone(220,.6,"square",.06);setTimeout(()=>playTone(180,.6,"square",.05),150);}
function sfxSwish(){playTone(800,.08,"sine",.04);setTimeout(()=>playTone(1200,.06,"sine",.03),60);}
function sfxCheer(){for(let i=0;i<5;i++)setTimeout(()=>playTone(400+rng()*600,.15,"triangle",.03),i*80);}
function sfxDrain(){playTone(600,.12,"sine",.05);setTimeout(()=>playTone(900,.08,"sine",.04),100);setTimeout(()=>playTone(1200,.15,"sine",.05),180);}

let S=null;

function members(st,conf){return st.schools.filter(s=>s.conf===conf);}
function confBrand(st,conf){const m=members(st,conf);if(!m.length)return 0;return m.reduce((a,s)=>a+s.brand,0)/m.length;}
function confBBall(st,conf){const m=members(st,conf);if(!m.length)return 0;return m.reduce((a,s)=>a+s.brand,0);}
function mediaValue(st,conf){
  const m=members(st,conf);if(!m.length)return 0;
  const avgBrand=confBrand(st,conf),totalMarket=m.reduce((a,s)=>a+s.market,0);
  return (avgBrand*0.6+totalMarket/m.length*0.4)*m.length*0.018;
}
function payoutOf(st,conf){
  const c=st.confs[conf];if(!c||c.dead)return 0;
  const m=members(st,conf);if(!m.length)return 0;
  return c.tv.rate/m.length;
}
function programValue(st,s){return s.brand*0.6+s.market*0.3+(s.stars||0)*8;}
function confValue(st,conf){return members(st,conf).reduce((a,s)=>a+programValue(st,s),0);}

function acceptChance(st,school,toConf){
  const from=school.conf,toC=st.confs[toConf],fromC=st.confs[from];
  if(!fromC||!toC)return 0;
  let p=35;
  const payDelta=payoutOf(st,toConf)-payoutOf(st,from);
  p+=Math.min(25,Math.max(-20,payDelta*2));
  const brandDelta=confBrand(st,toConf)-confBrand(st,from);
  p+=Math.min(15,Math.max(-10,brandDelta*0.3));
  if(school.mood<35)p+=15;
  if(school.mood<20)p+=10;
  if(school.mood>70)p-=15;
  if(fromC.exitFee>0)p-=Math.min(20,fromC.exitFee*0.8);
  if(fromC.gor)p-=25;
  if(fromC.wounded>0)p+=12;
  const dist=Math.sqrt(Math.pow(school.lat-members(st,toConf).reduce((a,s)=>a+s.lat,0)/members(st,toConf).length,2)+Math.pow(school.lon-members(st,toConf).reduce((a,s)=>a+s.lon,0)/members(st,toConf).length,2));
  if(dist>15)p-=8;
  if(school.lastCourt===st.year-1)p-=10;
  p+=st.confs[toConf].prestige*0.15;
  return Math.max(2,Math.min(95,Math.round(p)));
}

function moveSchool(st,school,toConf,quiet){
  const from=school.conf;
  school.conf=toConf;school.mood=50+rng()*10;
  if(!quiet){
    st.news.push({yr:st.year,txt:`🏀 <b>${school.name}</b> leaves the ${st.confs[from].name} for the <b>${st.confs[toConf].name}</b>!`,cls:"poach"});
    st.moves.push({from,to:toConf,school:school.abbr,yr:st.year});
  }
  checkCollapse(st,from);
}

function checkCollapse(st,conf){
  const m=members(st,conf);
  if(m.length<4&&conf!=="g5"){
    st.confs[conf].dead=true;
    st.news.push({yr:st.year,txt:`💀 <b>The ${st.confs[conf].name} has collapsed.</b> Remaining schools scatter.`,cls:"event"});
    m.forEach(s=>{s.conf="g5";s.mood=20+rng()*20;});
  }
}

/* ============================================================
   MARCH MADNESS ENGINE
   ============================================================ */
function calcTeamPower(st,school){
  return school.brand+(school.stars||0)*12+(school.mood-50)*0.3+rng()*20;
}

function generateBracket(st){
  const allTeams=st.schools.filter(s=>s.conf!=="g5"&&!st.confs[s.conf].dead);
  allTeams.forEach(t=>{t._power=calcTeamPower(st,t);});
  allTeams.sort((a,b)=>b._power-a._power);

  const confBids={};
  for(const id of ALLC){
    if(st.confs[id].dead)continue;
    const m=members(st,id);
    const avgPow=m.reduce((a,s)=>a+(s.brand+(s.stars||0)*10),0)/Math.max(m.length,1);
    let bids=Math.min(m.length,Math.max(1,Math.round(avgPow/25)));
    if(P5.includes(id))bids=Math.max(bids,Math.min(8,Math.round(m.length*0.45)));
    confBids[id]=bids;
  }

  const field=[];const used=new Set();
  for(const id of ALLC){
    if(st.confs[id].dead)continue;
    const cm=members(st,id).filter(s=>!used.has(s.id));
    cm.sort((a,b)=>b._power-a._power);
    const take=Math.min(confBids[id]||1,cm.length);
    for(let i=0;i<take&&field.length<64;i++){field.push(cm[i]);used.add(cm[i].id);}
  }
  while(field.length<64){
    const next=allTeams.find(t=>!used.has(t.id));
    if(!next)break;
    field.push(next);used.add(next.id);
  }

  field.sort((a,b)=>b._power-a._power);
  field.forEach((t,i)=>{t._seed=i+1;});
  return field.slice(0,64);
}

function simGame(t1,t2){
  const p1=t1._power+rng()*25,p2=t2._power+rng()*25;
  const diff=Math.abs(p1-p2);
  const buzzer=diff<8&&rng()<0.2;
  const upset=t1._seed>t2._seed&&p1>p2||t2._seed>t1._seed&&p2>p1;
  const bigUpset=upset&&Math.abs(t1._seed-t2._seed)>8;
  const winner=p1>=p2?t1:t2;
  const loser=p1>=p2?t2:t1;
  const s1=55+Math.round(rng()*30),s2=s1-Math.round(diff*0.4+rng()*8);
  return {winner,loser,score:[p1>=p2?s1:s2,p1>=p2?s2:s1],buzzer,upset,bigUpset};
}

function runTournament(st){
  const field=generateBracket(st);
  if(field.length<32)return null;

  const rounds=[];
  let current=field.slice(0,32);
  const roundNames=["Round of 32","Sweet 16","Elite 8","Final Four","Championship"];

  for(let r=0;r<5;r++){
    const results=[];
    for(let i=0;i<current.length;i+=2){
      if(i+1>=current.length)break;
      results.push(simGame(current[i],current[i+1]));
    }
    rounds.push({name:roundNames[r],games:results});
    current=results.map(g=>g.winner);
  }

  const champion=current[0];
  const playerConf=st.player;

  const myBids=field.filter(t=>t.conf===playerConf).length;
  const myFF=rounds.length>=4?rounds[3].games.filter(g=>g.winner.conf===playerConf||g.loser.conf===playerConf).length:0;
  const myChamp=champion&&champion.conf===playerConf?1:0;
  const myS16=rounds.length>=2?rounds[1].games.filter(g=>g.winner.conf===playerConf).length:0;
  const myE8=rounds.length>=3?rounds[2].games.filter(g=>g.winner.conf===playerConf).length:0;

  st.totalBids+=myBids;
  st.totalFF+=myFF;
  st.totalChamps+=myChamp;

  const pc=st.confs[playerConf];
  pc.marchBids+=myBids;
  if(myFF>0){pc.ffApps++;st.streak.ff++;pc.streak.drought=0;}
  else{st.streak.ff=0;pc.streak.drought++;}
  if(myChamp>0){pc.titles++;st.titles++;st.streak.champ++;sfxCheer();sfxDrain();spawnConfetti();}
  else st.streak.champ=0;

  st.combo+=myBids+myS16*2+myE8*3+myFF*5+myChamp*10;
  st.comboMax=Math.max(st.comboMax,st.combo);

  pc.prestige=Math.min(99,Math.max(5,pc.prestige+myChamp*8+myFF*3+myE8*1+myBids*0.5-2));

  const buzzers=rounds.flatMap(r=>r.games.filter(g=>g.buzzer&&(g.winner.conf===playerConf||g.loser.conf===playerConf)));
  const upsets=rounds.flatMap(r=>r.games.filter(g=>g.bigUpset&&g.winner.conf===playerConf));

  st.news.push({yr:st.year,txt:`🏆 <b>March Madness ${st.year}:</b> Your conference earned <b>${myBids} bids</b>. ${myFF>0?`<b>${myFF} Final Four</b> appearance${myFF>1?"s":""}! `:""}${myChamp?`<b>${champion.name} wins the National Championship!</b>`:""} ${!myChamp&&myFF>0?`Best finish: Final Four.`:""}${!myFF?`Best finish: ${myE8>0?"Elite 8":myS16>0?"Sweet 16":"Round of 32"}.`:""}`,cls:myChamp?"good":"madness"});

  if(buzzers.length>0){
    const bz=buzzers[0];
    st.news.push({yr:st.year,txt:`⏰ <b>Buzzer beater!</b> ${bz.winner.name} ${bz.score[0]}-${bz.score[1]} over ${bz.loser.name} in the ${rounds.find(r=>r.games.includes(bz))?.name||"tournament"}!`,cls:"event"});
    sfxBuzzer();
  }
  if(upsets.length>0){
    const up=upsets[0];
    st.news.push({yr:st.year,txt:`😱 <b>Cinderella!</b> #${up.winner._seed} ${up.winner.name} stuns #${up.loser._seed} ${up.loser.name}!`,cls:"event"});
  }

  st.lastBracket={field:field.map(t=>({abbr:t.abbr,name:t.name,seed:t._seed,conf:t.conf,color:t.color})),rounds:rounds.map(r=>({name:r.name,games:r.games.map(g=>({w:g.winner.abbr,l:g.loser.abbr,score:g.score,buzzer:g.buzzer,upset:g.upset}))})),champion:champion.abbr,playerBids:myBids,playerFF:myFF,playerChamp:myChamp};
  st.tourneyResults.push({yr:st.year,bids:myBids,ff:myFF,champ:myChamp,champion:champion.name});

  checkAchievements(st);
  return st.lastBracket;
}

function aiTurns(st){
  for(const id of ALLC){
    if(id===st.player||st.confs[id].dead)continue;
    const c=st.confs[id];
    if(rng()<0.15+c.prestige*0.003){
      const targets=st.schools.filter(s=>s.conf!==id&&s.conf!=="g5"&&!st.confs[s.conf].dead&&s.brand>55);
      if(!targets.length)continue;
      targets.sort((a,b)=>b.brand-a.brand);
      const pick=targets[Math.floor(rng()*Math.min(5,targets.length))];
      const chance=acceptChance(st,pick,id);
      if(rng()*100<chance){
        if(pick.conf===st.player){
          st.queue.push({type:"raid",school:pick.id,raider:id,chance});
        } else {
          moveSchool(st,pick,id);
          if(st.confs[pick.orig])st.confs[pick.orig].wounded=2;
        }
      }
    }
  }
}

function seasonEcon(st){
  for(const id of ALLC){
    const c=st.confs[id];if(c.dead)continue;
    if(st.year>=c.tv.expires){
      const mv=mediaValue(st,id);
      const mult=0.85+rng()*0.35+(c.prestige/100)*0.3;
      c.tv.rate=mv*mult;
      c.tv.len=3+Math.floor(rng()*5);
      c.tv.expires=st.year+c.tv.len;
      if(id===st.player){
        st.queue.push({type:"tvDeal",rate:c.tv.rate,len:c.tv.len});
      }
    }
    c.payout=payoutOf(st,id);
  }
}

function seasonMoods(st){
  for(const s of st.schools){
    if(s.conf==="g5")continue;
    const c=st.confs[s.conf];if(!c||c.dead)continue;
    const avgPay=ALLC.filter(id=>!st.confs[id].dead).reduce((a,id)=>a+payoutOf(st,id),0)/ALLC.filter(id=>!st.confs[id].dead).length;
    const payRatio=payoutOf(st,s.conf)/Math.max(1,avgPay);
    s.mood+=((payRatio-1)*8)+rng()*6-3;
    if(c.gor)s.mood-=rng()*2;
    if(s.tourney>0)s.mood+=3;
    s.mood=Math.max(5,Math.min(95,s.mood));
    s.stars=Math.max(0,(s.stars||0)-1+Math.floor(rng()*2));
  }
}

}

function rankConfs(st){
  return ALLC.filter(id=>!st.confs[id].dead).sort((a,b)=>{
    const pa=st.confs[a].prestige,pb=st.confs[b].prestige;
    if(Math.abs(pa-pb)>5)return pb-pa;
    return payoutOf(st,b)-payoutOf(st,a);
  });
}

/* ============================================================
   SEASON FLOW
   ============================================================ */
function advance(){
  if(S.over)return;
  if(S.queue.length)return processQueue();
  initAudio();
  S.ap=3;
  runSeason();
}

function runSeason(){
  yearEvents(S);
  aiTurns(S);
  if(S.queue.length)return processQueue();
  continueSeason();
}

function continueSeason(){
  seasonEcon(S);
  if(S.queue.length)return processQueue();
  finishSeason();
}

function finishSeason(){
  const bracket=runTournament(S);
  seasonMoods(S);

  S.nilBudget+=Math.round(payoutOf(S,S.player)*0.3+S.confs[S.player].prestige*0.2);

  S.year++;
  if(S.year>=S.endYear||S.confs[S.player].dead){
    S.over=true;
    renderAll();
    showEndScreen();
    return;
  }

  checkAchievements(S);
  renderAll();

  if(bracket){
    setTimeout(()=>showBracketModal(bracket),400);
  }
}

function processQueue(){
  if(!S.queue.length){continueSeason();return;}
  const item=S.queue.shift();
  if(item.type==="raid")showRaidModal(item);
  else if(item.type==="tvDeal")showTVDealModal(item);
  else if(item.type==="choice")showChoiceModal(item.data);
  else processQueue();
}

function spawnConfetti(){
  const canvas=$("confettiCanvas");
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const ctx=canvas.getContext("2d");
  const particles=[];
  const colors=["#f97316","#fbbf24","#4ade80","#60a5fa","#f472b6","#a78bfa","#ef4444"];
  for(let i=0;i<150;i++){
    particles.push({x:canvas.width*rng(),y:-20-rng()*200,vx:rng()*4-2,vy:2+rng()*4,
      w:4+rng()*6,h:8+rng()*10,color:colors[Math.floor(rng()*colors.length)],
      rot:rng()*360,rotV:rng()*10-5,life:1});
  }
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=0;
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.rot+=p.rotV;p.life-=0.005;
      if(p.life<=0||p.y>canvas.height+50)return;alive++;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    frame++;
    if(alive>0&&frame<300)requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

function renderMap(){
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 970 580");
  let path="M";
  OUTLINE.forEach((p,i)=>{const[x,y]=proj(p[0],p[1]);path+=(i?" L":"")+x.toFixed(1)+","+y.toFixed(1);});
  path+="Z";
  svg.innerHTML=`<path d="${path}" fill="#131629" stroke="#2a3355" stroke-width="1.5"/>`;

  S.schools.forEach(s=>{
    if(s.conf==="g5")return;
    const[x,y]=proj(s.lat,s.lon);
    const r=3+s.brand*0.06;
    const mine=s.conf===S.player;
    const c=S.confs[s.conf];
    const fill=s.color||"#888";
    const stroke=mine?S.confs[S.player].hex:(c?c.hex:"#555");
    const circle=document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx",x.toFixed(1));circle.setAttribute("cy",y.toFixed(1));
    circle.setAttribute("r",r.toFixed(1));circle.setAttribute("fill",fill);
    circle.setAttribute("stroke",stroke);circle.setAttribute("stroke-width",mine?"2.5":"1");
    if(mine)circle.setAttribute("filter","url(#glow)");
    circle.classList.add("dot");
    circle.addEventListener("mouseenter",e=>showTip(e,s));
    circle.addEventListener("mouseleave",()=>{$("tip").style.display="none";});
    svg.appendChild(circle);

  const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
  defs.innerHTML=`<filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="${S.confs[S.player].hex}" flood-opacity="0.7"/></filter>`;
  svg.prepend(defs);

  const panel=$("mapPanel");
  const existing=panel.querySelector("svg");
  if(existing)existing.remove();
  panel.appendChild(svg);
}

}

}

function doDeal(rate,len){

}

function doExpel(id){

function showInvestPicker(st){
  const m=members(st,st.player).sort((a,b)=>a.brand-b.brand);
  const html=`<h2>📈 Invest in Program</h2><div class="sub">Spend $10M to boost a school's basketball brand. War chest: ${fmtM(st.nilBudget)}</div>
    <div class="body">${m.map(s=>`<div class="mrow" style="cursor:pointer" onclick="doInvest(${s.id})">

      <span>Brand: ${Math.round(s.brand)}</span></div>`).join("")}</div>
    <div class="btnRow"><button class="btn-ghost" onclick="hideModal()">Cancel</button></div>`;
  showModal(html);
}

function doInvest(id){
  const s=S.schools[id];
  if(S.nilBudget<10)return toast("Not enough funds!");
  S.nilBudget-=10;S.ap--;
  s.brand=Math.min(99,s.brand+6+rng()*4);
  hideModal();
  toast(`📈 ${s.name} basketball program upgraded!`);
  sfxSwish();
  renderAll();
}

function showRaidModal(item){
  const s=S.schools[item.school];
  const raider=S.confs[item.raider];
  const html=`<h2>🚨 Raid Alert!</h2>
    <div class="sub">The ${raider.name} is courting <b>${s.name}</b>!</div>
    <div class="body"><p><b style="color:${s.color}">${s.name}</b> (Brand: ${Math.round(s.brand)}, Mood: ${Math.round(s.mood)}%) is being courted by the <b style="color:${raider.hex}">${raider.name}</b>.</p>
    <p>Chance they leave: <span style="color:var(--red);font-weight:900">${item.chance}%</span></p></div>
    <div class="btnRow">
      <button class="btn-cta" onclick="counterRaid(${item.school},'retain')">Retain ($5M + mood boost)</button>
      <button class="btn-ghost" onclick="counterRaid(${item.school},'let')">Let Them Go</button>
    </div>`;
  showModal(html);
}

function counterRaid(schoolId,action){
  const s=S.schools[schoolId];
  hideModal();
  if(action==="retain"){
    S.nilBudget=Math.max(0,S.nilBudget-5);
    s.mood=Math.min(85,s.mood+20);
    toast(`🤝 Convinced ${s.name} to stay!`);
    S.combo+=2;
  } else {
    if(rng()*100<50){
      moveSchool(S,s,S.queue.find(q=>q.school===schoolId)?.raider||"g5");
      toast(`💔 ${s.name} has left your conference.`);
      S.combo=0;
    } else {
      toast(`${s.name} decided to stay after all!`);
    }
  }
  renderAll();
  processQueue();
}

      <button class="btn-cta" onclick="signDeal(${mv},5)">Medium (5yr) ${fmtM(mv)}</button>

    </div>`;

function signDeal(rate,len){

  hideModal();

    <div class="sub">${S.confs[s.conf]?.name||"Independent"}</div>

}

/* ============================================================
   BRACKET MODAL
   ============================================================ */
function showBracketModal(bracket){
  if(!bracket)return;
  const playerConf=S.player;

  let html=`<h2>🏀 March Madness ${S.year-1}</h2>
    <div class="sub">Your conference: <b>${bracket.playerBids} bids</b> | Final Four: <b>${bracket.playerFF}</b> | Champion: <b style="color:var(--gold)">${bracket.champion}</b></div>
    <div class="bracket-wrap">`;

  bracket.rounds.forEach((round,ri)=>{
    html+=`<div class="bracket-round"><div class="round-label">${round.name}</div>`;
    round.games.forEach(g=>{
      const wSchool=bracket.field.find(t=>t.abbr===g.w);
      const lSchool=bracket.field.find(t=>t.abbr===g.l);
      const wMine=wSchool&&wSchool.conf===playerConf;
      const lMine=lSchool&&lSchool.conf===playerConf;
      html+=`<div class="bracket-match${g.buzzer?" buzzer":""}">
        <div class="team winner${wMine?" mine":""}"><span class="seed">${wSchool?wSchool.seed:""}</span><span style="color:${wSchool?.color||"#fff"}">${g.w}</span><span>${g.score[0]}</span></div>
        <div class="team${lMine?" mine":""}"><span class="seed">${lSchool?lSchool.seed:""}</span><span style="color:${lSchool?.color||"#888"}">${g.l}</span><span>${g.score[1]}</span></div>
      </div>`;
    });
    html+=`</div>`;
  });

  html+=`</div>`;

  if(bracket.playerChamp>0){
    html+=`<div style="text-align:center;margin-top:12px"><span style="font-size:36px">🏆</span><div style="font-size:18px;font-weight:900;color:var(--gold)">YOUR CONFERENCE WINS THE NATIONAL CHAMPIONSHIP!</div></div>`;
  }

  html+=`<div class="btnRow"><button class="btn-cta" onclick="hideModal()">Continue</button></div>`;
  showModal(html);
}

   START SCREEN
   ============================================================ */
function showStartScreen(){
  const html=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:48px">🏀</div>
      <h2 style="font-size:28px;letter-spacing:2px"><span style="color:var(--ora)">HOOPS</span> WARS</h2>
      <div class="sub" style="font-size:14px">Basketball Conference Tycoon</div>
      <p style="color:var(--dim);font-size:12.5px;max-width:400px;margin:0 auto;line-height:1.6">
        Run a college basketball conference through 30 years of March Madness, NIL money, TV deals, and betrayal.
        Court schools, build a dynasty, dominate the bracket.
      </p>
    </div>
    <div class="secLbl" style="margin-bottom:8px">Choose Your Conference</div>
    <div class="pickGrid">
      ${ALLC.map(id=>{
        const c=CONF_META[id];const m=SCHOOL_ROWS.filter(r=>r[2]===id);
        const df=c.diff==="easy"?"easy":c.diff==="med"?"med":c.diff==="hard"?"hard":"ext";
        return `<div class="pick" onclick="startGame('${id}')">
          <div class="nm"><i style="background:${c.hex}"></i>${c.name}</div>
          <div class="meta">${m.length} schools · ${c.blurb.slice(0,80)}...</div>
          <div class="diff ${df}">${df==="easy"?"EASY":df==="med"?"MEDIUM":df==="hard"?"HARD":"EXTREME"}</div>
        </div>`;
      }).join("")}
    </div>
    <div style="text-align:center;margin-top:18px">
      <button class="btn-gold" onclick="startDaily()">📅 Daily Challenge</button>
    </div>`;
  showModal(html);
}

function startGame(conf){
  rng=Math.random;
  S=newState(conf);
  hideModal();
  renderAll();
  S.news.push({yr:S.year,txt:`🏀 <b>Welcome, Commissioner.</b> You now lead the <b>${S.confs[conf].name}</b>. Build a basketball dynasty. Dominate March Madness. Make history.`,cls:"good"});
  renderAll();
}

function startDaily(){
  const today=new Date();
  const seed=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();
  rng=mulberry32(seed);
  const conf=ALLC[Math.floor(rng()*ALLC.length)];
  S=newState(conf);
  S.dailySeed=seed;
  hideModal();
  renderAll();
  S.news.push({yr:S.year,txt:`📅 <b>Daily Challenge:</b> You are the <b>${S.confs[conf].name}</b> commissioner. Everyone gets the same scenario today. Good luck!`,cls:"event"});
  renderAll();
}

/* ============================================================
   END SCREEN & SCORING
   ============================================================ */
function finalScore(){
  const st=S;
  const c=st.confs[st.player];
  let money=0;
  const ranks=rankConfs(st);
  const rank=ranks.indexOf(st.player)+1;
  money+=Math.max(0,40-rank*4);
  money+=Math.min(25,payoutOf(st,st.player)*3);
  const brandGrowth=confBrand(st,st.player)-st.brandStart;
  money+=Math.min(15,brandGrowth*0.5);
  money+=Math.min(20,st.titles*7);
  return Math.max(0,Math.min(100,Math.round(money)));
}

function soulScore(){
  const st=S;
  let soul=0;
  const avgMood=members(st,st.player).reduce((a,s)=>a+s.mood,0)/Math.max(1,members(st,st.player).length);
  soul+=Math.min(35,avgMood*0.4);
  const origKept=st.schools.filter(s=>s.conf===st.player&&s.orig===st.player).length;
  const origTotal=st.schools.filter(s=>s.orig===st.player).length;
  soul+=Math.min(25,(origKept/Math.max(1,origTotal))*25);
  soul+=Math.min(20,st.totalBids*0.4);
  soul+=Math.min(20,Math.round(st.confs[st.player].prestige*0.2));
  soul-=st.expels*5;
  return Math.max(0,Math.min(100,Math.round(soul)));
}

function letterGrade(score){
  if(score>=95)return"S";if(score>=88)return"A+";if(score>=80)return"A";
  if(score>=72)return"B+";if(score>=64)return"B";if(score>=55)return"C+";
  if(score>=45)return"C";if(score>=30)return"D";return"F";
}

function gradeColor(g){
  if(g==="S")return"#f97316";if(g.startsWith("A"))return"#4ade80";
  if(g.startsWith("B"))return"#fbbf24";if(g.startsWith("C"))return"#60a5fa";
  return"#f87171";
}

function showEndScreen(){
  const ms=finalScore(),ss=soulScore();
  const mg=letterGrade(ms),sg=letterGrade(ss);

  const badges=BADGES.filter(b=>S.achievements.has(b.id));
  const results=S.tourneyResults;
  const totalBids=results.reduce((a,r)=>a+r.bids,0);
  const totalFF=results.reduce((a,r)=>a+r.ff,0);
  const totalChamps=results.reduce((a,r)=>a+r.champ,0);

  const epilogue=totalChamps>=5?"You built a basketball empire that will echo through the ages. The conference you shaped is the gold standard of college hoops.":
    totalChamps>=2?"Multiple championships define your legacy. Your conference became a March Madness powerhouse.":
    totalChamps>=1?"A national championship crowns a successful tenure. Your conference can hold its head high.":
    totalFF>=5?"Final Four appearances show consistent excellence, even without the ultimate prize.":
    S.confs[S.player].dead?"Your conference collapsed. The basketball world moved on without you.":
    "Thirty years, countless games, one story. Your conference survived — and that's something.";

  const html=`
    <div style="text-align:center;margin-bottom:16px"><span style="font-size:48px">🏀</span>
    <h2>THE FINAL BUZZER</h2><div class="sub">${S.confs[S.player].name} · ${S.startYear}–${S.year}</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0">
      <div style="text-align:center">
        <div class="secLbl">Money Grade</div>
        <div class="grade gradeStamp" style="color:${gradeColor(mg)}">${mg}</div>
        <div style="color:var(--dim);font-size:12px">${ms}/100</div>
      </div>
      <div style="text-align:center">
        <div class="secLbl">Legacy Grade</div>
        <div class="grade gradeStamp" style="color:${gradeColor(sg)};animation-delay:.4s">${sg}</div>
        <div style="color:var(--dim);font-size:12px">${ss}/100</div>
      </div>
    </div>
    <div class="recap"><p>${epilogue}</p>
      <p style="margin-top:8px"><b>March Madness Record:</b> ${totalBids} total bids · ${totalFF} Final Four · ${totalChamps} Championships</p>
      <p><b>Conference:</b> ${members(S,S.player).length} members · Prestige: ${Math.round(S.confs[S.player].prestige)} · Payout: ${fmtM(payoutOf(S,S.player))}/school</p>
      <p><b>Best Combo:</b> ${S.comboMax} · <b>Schools Poached:</b> ${S.moves.filter(m=>m.to===S.player).length} · <b>Schools Lost:</b> ${S.moves.filter(m=>m.from===S.player).length}</p>
    </div>
    ${badges.length?`<div class="secLbl">Achievements</div><div style="margin-top:8px">${badges.map(b=>`<span class="badge earned" title="${b.desc}">${b.name}</span>`).join("")}</div>`:""}
    <div class="btnRow" style="margin-top:20px">
      <button class="btn-cta" onclick="showStartScreen()">Play Again</button>
      <button class="btn-ghost" onclick="hideModal()">View Final State</button>
    </div>`;
  showModal(html);
  if(totalChamps>0)spawnConfetti();
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.add("on");
  clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove("on"),2800);
}

/* ============================================================
   KEYBOARD & INIT
   ============================================================ */
document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&!S?.over&&$("shade").style.display!=="flex"){e.preventDefault();advance();}
  if(e.code==="Escape")hideModal();
});

window.addEventListener("load",()=>{
  renderAll();
  showStartScreen();
});
</script>
