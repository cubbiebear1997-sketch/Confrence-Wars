<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOOPS WARS — Basketball Conference Tycoon</title>
<meta name="description" content="Run a college basketball conference through 30 years of March Madness, NIL money, and betrayal. Court schools, dominate the bracket, build a dynasty.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
<style>
@font-face{font-family:'B';src:url(data:font/woff2;base64,)format('woff2');font-weight:900}
:root{
  --bg:#0d0f1a;--bg2:#131629;--panel:#181d35;--panel2:#1c234066;
  --line:#2a3355;--ink:#e8ecfa;--dim:#8090b8;--faint:#4a5580aa;
  --ora:#f97316;--ora-d:#ea580c;--gold:#fbbf24;--red:#f87171;--green:#4ade80;--blue:#60a5fa;--pink:#f472b6;
  --wood:#d4a853;--court:#c4713a;--purple:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 70% -10%,#2a1a0a44,transparent 60%),var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:14px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,#181d35,#131629);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:2.5px;font-size:16px;white-space:nowrap}
.logo b{color:var(--ora)}
.logo small{display:block;font-size:8px;letter-spacing:3.5px;color:var(--dim);font-weight:600}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-align:center}
.chip .k{font-size:8px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase}
.chip .v{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.chip .v.ora{color:var(--ora)}.chip .v.gold{color:var(--gold)}.chip .v.green{color:var(--green)}
.spacer{flex:1}
button{font-family:inherit;border:none;border-radius:9px;cursor:pointer;font-weight:700;letter-spacing:.4px;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:7px 12px;transition:filter .12s,transform .05s}
button:hover{filter:brightness(1.18)}button:active{transform:translateY(1px)}
button:disabled{opacity:.38;cursor:not-allowed;filter:none}
.btn-cta{background:linear-gradient(180deg,var(--ora),var(--ora-d));color:#1a0800;font-size:14px;padding:10px 20px;border:none;box-shadow:0 0 18px #ea580c55;letter-spacing:1px}
.btn-gold{background:linear-gradient(180deg,#fbbf24,#d97706);color:#2a1c00;border:none}
.btn-ghost{background:transparent}
.btn-red{background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;border:none}
.btn-purple{background:linear-gradient(180deg,#a78bfa,#7c3aed);color:#fff;border:none}
.btn-green{background:linear-gradient(180deg,#4ade80,#16a34a);color:#052e16;border:none}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}
#main{display:grid;grid-template-columns:280px 1fr 330px;gap:10px;padding:10px 12px;flex:1;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{padding:8px 12px;border-bottom:1px solid var(--line);font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:8px}
.ph .right{margin-left:auto;letter-spacing:0}
.pb{padding:8px 10px;overflow-y:auto;flex:1;min-height:0}
.pb::-webkit-scrollbar,#news::-webkit-scrollbar{width:7px}
.pb::-webkit-scrollbar-thumb,#news::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
#left{display:flex;flex-direction:column;gap:10px;min-height:0}
#myStats{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.stat .k{font-size:8px;letter-spacing:1.2px;color:var(--dim);text-transform:uppercase}
.stat .v{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .s{font-size:9px;color:var(--dim)}
#tvRow{grid-column:1/-1;display:flex;align-items:center;gap:8px}
#tvRow .bar{flex:1;height:5px;background:var(--faint);border-radius:3px;overflow:hidden}
#tvRow .bar i{display:block;height:100%;background:var(--gold)}
#memberList{display:flex;flex-direction:column;gap:4px}
.mem{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid transparent;border-radius:7px;padding:5px 8px;cursor:pointer;font-size:12px}
.mem:hover{border-color:var(--ora)}
.mem .ab{font-weight:800;width:34px;font-size:11px}
.mem .nm{flex:1;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .mood{width:44px;height:4px;background:var(--faint);border-radius:3px;overflow:hidden}
.mem .mood i{display:block;height:100%}
.mem .br{font-size:10px;color:var(--dim);width:22px;text-align:right;font-variant-numeric:tabular-nums}
#center{display:flex;flex-direction:column;gap:10px;min-height:0}
#mapPanel{flex:1;min-height:0;position:relative;overflow:hidden}
#mapPanel svg{width:100%;height:100%;display:block;cursor:grab}
#mapPanel svg.dragging{cursor:grabbing}
#zoomCtl{position:absolute;right:10px;top:38px;display:flex;flex-direction:column;gap:5px;z-index:5}
.zbtn{width:30px;height:30px;padding:0;font-size:15px;font-weight:800;background:#0d0f1ad9;border:1px solid var(--line);border-radius:7px}
#legend{position:absolute;left:10px;bottom:8px;display:flex;flex-wrap:wrap;gap:5px;max-width:85%;z-index:5}
.lg{display:flex;align-items:center;gap:4px;font-size:9px;font-weight:700;letter-spacing:.6px;color:var(--dim);background:#0d0f1acc;border:1px solid var(--line);border-radius:5px;padding:2px 7px;cursor:pointer;transition:border-color .15s}
.lg i{width:7px;height:7px;border-radius:50%}
.lg:hover{border-color:var(--ora)}
.lg.active{border-color:var(--ora);color:var(--ink)}
#tip{position:absolute;pointer-events:none;background:#0d0f1af2;border:1px solid var(--ora);border-radius:9px;padding:8px 10px;font-size:11px;display:none;z-index:30;min-width:160px;box-shadow:0 6px 24px #0009}
#tip .t{font-weight:800;font-size:12px}
#tip .c{color:var(--dim);margin-bottom:4px}
#tip .row{display:flex;justify-content:space-between;gap:12px}
#tip .row span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
#standings{height:190px;flex:none}
#standTable{width:100%;border-collapse:collapse;font-size:11px}
#standTable td{padding:3px 5px;border-bottom:1px solid #2a335555;font-variant-numeric:tabular-nums;white-space:nowrap}
#standTable td.cn{font-weight:800}
#standTable tr.me td{background:#f9731611}
#right{display:flex;flex-direction:column;gap:10px;min-height:0}
#actionsBody{display:flex;flex-direction:column;gap:5px;padding:8px 10px}
.act{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;text-align:left;font-size:12px}
.act:hover{border-color:var(--ora);filter:none}
.act .ic{font-size:14px;width:20px;text-align:center}
.act .tx{flex:1}
.act .tt{font-size:11.5px;font-weight:700}
.act .td{font-size:9.5px;color:var(--dim);font-weight:400}
.act .ap{font-size:9px;font-weight:800;color:var(--gold);white-space:nowrap}
.act.locked{opacity:.4;pointer-events:none}
.act.locked .ap{color:var(--dim)}
.act.new{border-color:var(--purple);animation:newPulse 2s ease infinite}
@keyframes newPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 12px #a78bfa44}}
#newsPanel{flex:1;min-height:0}
#news{overflow-y:auto;flex:1;min-height:0;padding:8px 8px;display:flex;flex-direction:column;gap:6px}
.nw{display:flex;gap:8px;font-size:12.5px;line-height:1.5;color:#eef4ff;background:#151a30;border-left:3px solid var(--dim);border-radius:0 8px 8px 0;padding:6px 10px;animation:slidein .25s ease}
.nw.poach{border-left-color:var(--red);background:#1a1525}.nw.money{border-left-color:var(--ora)}.nw.event{border-left-color:var(--gold)}.nw.good{border-left-color:var(--green)}.nw.madness{border-left-color:var(--blue);background:#12162a}.nw.war{border-left-color:var(--purple);background:#1a1530}.nw.bet{border-left-color:var(--pink)}
.nw b{color:#fff}
.nw .yr{font-size:10px;font-weight:800;color:#8090b8;padding-top:2px;font-variant-numeric:tabular-nums;flex:none}
@keyframes slidein{from{opacity:0;transform:translateY(-5px)}to{opacity:1}}
#shade{position:fixed;inset:0;background:#050816dd;display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
#modal{background:linear-gradient(180deg,#1e2548,#181d35);border:1px solid #3a4570;border-radius:15px;max-width:740px;width:94%;max-height:90vh;overflow-y:auto;padding:20px 22px;box-shadow:0 20px 70px #000c}
#modal h2{font-size:18px;letter-spacing:.5px;margin-bottom:4px}
#modal .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
#modal .body{font-size:12.5px;line-height:1.5}
.mrow{display:flex;justify-content:space-between;gap:14px;padding:5px 2px;border-bottom:1px solid #2a335566;font-size:12px}
.mrow span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.mrow:hover{background:#ffffff06;border-radius:4px}
.odds{font-size:34px;font-weight:900;text-align:center;margin:10px 0 2px}
.oddsLbl{text-align:center;color:var(--dim);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.btnRow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btnRow button{flex:1;min-width:120px;padding:10px 8px}
.pickGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pick{border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;background:var(--bg2);position:relative;transition:border-color .15s,box-shadow .15s}
.pick:hover{border-color:var(--ora);box-shadow:0 0 14px #f9731633}
.pick .nm{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:6px}
.pick .nm i{width:10px;height:10px;border-radius:50%}
.pick .meta{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.pick .diff{position:absolute;top:9px;right:10px;font-size:9px;letter-spacing:1px;font-weight:800;border-radius:5px;padding:2px 6px}
.diff.easy{background:#14532d;color:#86efac}.diff.med{background:#57420b;color:#fde68a}.diff.hard{background:#5c1a1a;color:#fca5a5}.diff.ext{background:#3b1d5c;color:#d8b4fe}
.grade{font-size:66px;font-weight:900;text-align:center;line-height:1}
.gradeStamp{opacity:0;animation:stamp .8s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stamp{0%{transform:scale(2.8) rotate(-7deg);opacity:0}55%{opacity:1}78%{transform:scale(.94) rotate(0)}100%{transform:scale(1);opacity:1}}
.reveal{opacity:0;animation:rev .55s ease forwards}
@keyframes rev{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.recap{margin-top:10px;max-height:220px;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:11.5px;line-height:1.55}
.recap b{color:var(--gold)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:-60px;background:var(--panel);border:1px solid var(--ora);color:var(--ink);border-radius:10px;padding:9px 16px;font-size:12.5px;z-index:80;transition:bottom .3s;box-shadow:0 8px 30px #000a;max-width:400px;text-align:center}
#toast.on{bottom:20px}
.dot{cursor:pointer;transition:r .15s}
.moveArc{fill:none;stroke-width:2.4;stroke-dasharray:9 7;stroke-linecap:round;animation:arcdash 1.1s ease-out forwards,arcfade 1.7s ease forwards;pointer-events:none}
.pulseC{animation:pulseK .95s ease-out forwards;pointer-events:none}
@keyframes arcdash{from{stroke-dashoffset:640}to{stroke-dashoffset:0}}
@keyframes arcfade{0%{opacity:0}12%{opacity:.95}75%{opacity:.85}100%{opacity:0}}
@keyframes pulseK{0%{r:5;opacity:.95}100%{r:30;opacity:0}}
.streak{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(90deg,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;font-size:13px;animation:streakPulse 1s ease infinite}
@keyframes streakPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.bracket-match{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;margin:2px 0;font-size:11px;min-width:130px}
.bracket-match .team{display:flex;justify-content:space-between;padding:2px 0}
.bracket-match .team.winner{color:var(--ora);font-weight:800}
.bracket-match .team .seed{color:var(--dim);width:16px;font-size:9px}
.bracket-match .team.mine{background:#f9731611;border-radius:3px}
.bracket-round{display:flex;flex-direction:column;justify-content:space-around;gap:3px;padding:0 3px}
.bracket-wrap{display:flex;align-items:stretch;overflow-x:auto;gap:2px;padding:8px}
.round-label{text-align:center;font-size:8px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;font-weight:700;padding:3px 0}
.confetti{position:fixed;pointer-events:none;z-index:100}
.secLbl{font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-weight:800;margin:12px 0 0}
.tgl{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px;cursor:pointer;font-size:12px}
.tgl input{accent-color:var(--ora);transform:scale(1.2)}
@media(max-width:920px){#app{min-width:1180px}body{overflow:auto}}
.badge{display:inline-block;background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;margin:2px;font-size:10.5px;font-weight:700}
.badge.earned{border-color:var(--ora);color:var(--ora);background:#f9731611}
.nilBar{height:7px;background:var(--faint);border-radius:4px;overflow:hidden;margin:3px 0}
.nilBar i{display:block;height:100%;background:linear-gradient(90deg,var(--ora),var(--gold));border-radius:4px;transition:width .3s}
.upgrade{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:4px 0;font-size:11.5px}
.upgrade.unlocked{border-color:var(--gold);background:#fbbf2409}
.upgrade.locked{opacity:.5}
.upgrade .uIcon{font-size:18px;width:28px;text-align:center}
.upgrade .uInfo{flex:1}
.upgrade .uName{font-weight:800;font-size:12px}
.upgrade .uDesc{font-size:10px;color:var(--dim)}
.upgrade .uReq{font-size:9px;font-weight:800;color:var(--gold);white-space:nowrap}
.betCard{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer;transition:border-color .15s}
.betCard:hover{border-color:var(--pink)}
.betCard .betTitle{font-weight:800;font-size:13px}
.betCard .betOdds{color:var(--pink);font-size:12px;font-weight:700}
.betCard .betDesc{color:var(--dim);font-size:10.5px;margin-top:2px}
.betCard.active{border-color:var(--pink);box-shadow:0 0 12px #f472b633}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-4px,2px) rotate(-1deg)}30%{transform:translate(3px,-2px) rotate(1deg)}50%{transform:translate(-2px,1px)}70%{transform:translate(3px,-1px) rotate(-0.5deg)}90%{transform:translate(-1px,1px)}}
.shaking{animation:shake .5s ease}
@keyframes tickUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tickAnim{animation:tickUp .3s ease}
.milestone{position:relative;overflow:visible}
.milestone::after{content:"NEW";position:absolute;top:-4px;right:-4px;font-size:7px;font-weight:900;background:var(--ora);color:#fff;padding:1px 4px;border-radius:3px;letter-spacing:1px}
.xpBar{height:4px;background:var(--faint);border-radius:2px;overflow:hidden;margin-top:3px}
.xpBar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));border-radius:2px;transition:width .5s}
.tabBar{display:flex;gap:2px;margin-bottom:8px}
.tab{flex:1;text-align:center;padding:6px 4px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;cursor:pointer;transition:color .15s,border-color .15s}
.tab.active{color:var(--ora);border-bottom-color:var(--ora)}
.tab:hover{color:var(--ink)}
.warBanner{background:linear-gradient(135deg,#2d1540,#1a1530);border:1px solid var(--purple);border-radius:9px;padding:8px 12px;margin:6px 0;text-align:center}
.warBanner .warTitle{font-size:11px;font-weight:800;color:var(--purple);letter-spacing:1px;text-transform:uppercase}
.warBanner .warTarget{font-size:14px;font-weight:900;margin-top:2px}
.warBanner .warBonus{font-size:10px;color:var(--dim);margin-top:2px}
.saveIcon{display:inline-block;font-size:10px;color:var(--green);margin-left:6px;opacity:0;transition:opacity .3s}
.saveIcon.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo"><b>HOOPS</b> WARS<small>BASKETBALL CONFERENCE TYCOON</small></div>
    <div class="chip"><div class="k">Season</div><div class="v ora" id="yearV"></div></div>
    <div class="chip"><div class="k">Conference</div><div class="v" id="confV"></div></div>
    <div class="chip"><div class="k">Prestige</div><div class="v gold" id="prestigeV"></div></div>
    <div class="chip"><div class="k">War Chest</div><div class="v green" id="chestV"></div></div>
    <div class="chip"><div class="k">Actions</div><div class="v ora" id="apV"></div></div>
    <div class="chip"><div class="k">Streak</div><div class="v" id="streakV"></div></div>
    <div class="chip"><div class="k">XP</div><div class="v" id="xpV" style="color:var(--purple)"></div></div>
    <div class="spacer"></div>
    <button class="btn-sm btn-ghost" onclick="saveGame()" title="Save">💾</button>
    <span class="saveIcon" id="saveIcon">saved</span>
    <button class="btn-cta" id="advBtn" onclick="advance()">ADVANCE SEASON ▸</button>
  </div>
  <div id="main">
    <div id="left">
      <div class="panel" id="officePanel"><div class="ph">🏀 Front Office</div><div id="myStats" class="pb"></div></div>
      <div class="panel" style="flex:1;min-height:0"><div class="ph">👥 Members <span class="right" id="memCount"></span></div><div class="pb" id="memberWrap"><div id="memberList"></div></div></div>
    </div>
    <div id="center">
      <div class="panel" id="mapPanel"><div class="ph">🗺️ Landscape <span class="right"><span style="font-size:8px;color:var(--dim)">scroll to zoom · drag to pan</span></span></div></div>
      <div class="panel" id="standings"><div class="ph">📊 Power Rankings</div><div class="pb"><table id="standTable"></table></div></div>
    </div>
    <div id="right">
      <div class="panel"><div class="ph">⚡ Actions <span class="right" id="actionTab"></span></div><div id="actionsBody"></div></div>
      <div class="panel" id="newsPanel"><div class="ph">📰 The Wire</div><div id="news"></div></div>
    </div>
  </div>
</div>
<div id="shade"><div id="modal"></div></div>
<div id="tip"></div>
<div id="toast"></div>
<canvas id="confettiCanvas" class="confetti" width="1" height="1"></canvas>

<script>
"use strict";
const CONF_META={
  b1g:{name:"Big Ten",hex:"#4f8ef7",diff:"med",blurb:"Historic basketball pedigree. Indiana, Michigan State, Purdue — blue-collar hoops royalty with massive TV money."},
  sec:{name:"SEC",hex:"#f5b83d",diff:"med",blurb:"Kentucky runs the show, but the league is deeper than ever. Football money funds basketball ambitions."},
  b12:{name:"Big 12",hex:"#f87171",diff:"easy",blurb:"Kansas is the crown jewel. The conference tournament in KC is religion. Deep, balanced, and dangerous."},
  acc:{name:"ACC",hex:"#a78bfa",diff:"easy",blurb:"Duke, UNC, and Tobacco Road. The most storied basketball conference ever assembled."},
  be:{name:"Big East",hex:"#f472b6",diff:"hard",blurb:"Basketball-only and proud. Madison Square Garden is your cathedral. Nova and UConn are your identity."},
  aac:{name:"AAC",hex:"#fb923c",diff:"hard",blurb:"Memphis and Houston left scars. Rebuild from Wichita State and Temple. Prove the mid-major ceiling is a myth."},
  mw:{name:"Mountain West",hex:"#38bdf8",diff:"ext",blurb:"San Diego State showed it's possible. UNLV's ghosts haunt the rafters. Climb from the basement."},
  wcc:{name:"WCC",hex:"#a3e635",diff:"ext",blurb:"Gonzaga proved a mid-major can own March. Keep them happy, grow the brand, shock the world."},
};
const SCHOOL_ROWS=[

function convexHull(pts){
  if(pts.length<3)return pts;
  pts=[...pts].sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[];for(const p of pts){while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  const hi=[];for(const p of[...pts].reverse()){while(hi.length>=2&&cross(hi[hi.length-2],hi[hi.length-1],p)<=0)hi.pop();hi.push(p);}
  return lo.slice(0,-1).concat(hi.slice(0,-1));
}

let audioCtx=null;
function initAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function playTone(freq,dur,type,vol){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||"sine";o.frequency.value=freq;g.gain.value=vol||.08;
  o.connect(g);g.connect(audioCtx.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
}

let S=null;

function members(st,conf){return st.schools.filter(s=>s.conf===conf);}
function confBrand(st,conf){const m=members(st,conf);if(!m.length)return 0;return m.reduce((a,s)=>a+s.brand,0)/m.length;}
function mediaValue(st,conf){
  const m=members(st,conf);if(!m.length)return 0;
  const avgBrand=confBrand(st,conf),totalMarket=m.reduce((a,s)=>a+s.market,0);
  return (avgBrand*0.6+totalMarket/m.length*0.4)*m.length*0.018;
}
function payoutOf(st,conf){
  const c=st.confs[conf];if(!c||c.dead)return 0;
  const m=members(st,conf);if(!m.length)return 0;
  return c.tv.rate/m.length;
}
function programValue(st,s){return s.brand*0.6+s.market*0.3+(s.stars||0)*8;}
function confValue(st,conf){return members(st,conf).reduce((a,s)=>a+programValue(st,s),0);}

function hasUpgrade(st,id){return st.upgrades&&st.upgrades.includes(id);}

function acceptChance(st,school,toConf){
  const from=school.conf,toC=st.confs[toConf],fromC=st.confs[from];
  if(!fromC||!toC)return 0;
  let p=35;
  const payDelta=payoutOf(st,toConf)-payoutOf(st,from);
  p+=Math.min(25,Math.max(-20,payDelta*2));
  const brandDelta=confBrand(st,toConf)-confBrand(st,from);
  p+=Math.min(15,Math.max(-10,brandDelta*0.3));
  if(school.mood<35)p+=15;
  if(school.mood<20)p+=10;
  if(school.mood>70)p-=15;
  if(fromC.exitFee>0)p-=Math.min(20,fromC.exitFee*0.8);
  if(fromC.gor)p-=25;
  if(fromC.wounded>0)p+=12;
  const mems=members(st,toConf);
  if(mems.length>0){
    const dist=Math.sqrt(Math.pow(school.lat-mems.reduce((a,s)=>a+s.lat,0)/mems.length,2)+Math.pow(school.lon-mems.reduce((a,s)=>a+s.lon,0)/mems.length,2));
    if(dist>15)p-=8;
  }
  if(school.lastCourt===st.year-1)p-=10;
  p+=st.confs[toConf].prestige*0.15;
  if(hasUpgrade(st,"scout")&&toConf===st.player)p+=12;
  if(st.warTarget&&from===st.warTarget&&toConf===st.player)p+=15;
  return Math.max(2,Math.min(95,Math.round(p)));
}

function moveSchool(st,school,toConf,quiet){
  const from=school.conf;
  school.conf=toConf;school.mood=50+rng()*10;
  if(!quiet){
    st.news.push({yr:st.year,txt:`🏀 <b>${school.name}</b> leaves the ${st.confs[from]?.name||"Independents"} for the <b>${st.confs[toConf].name}</b>!`,cls:"poach"});
    st.moves.push({from,to:toConf,school:school.abbr,yr:st.year});
  }
  checkCollapse(st,from);
}

function checkCollapse(st,conf){
  const m=members(st,conf);
  if(m.length<4&&conf!=="g5"&&!st.confs[conf].dead){
    st.confs[conf].dead=true;
    st.news.push({yr:st.year,txt:`💀 <b>The ${st.confs[conf].name} has collapsed.</b> Remaining schools scatter.`,cls:"event"});
    m.forEach(s=>{s.conf="g5";s.mood=20+rng()*20;});
  }
}

function gainXP(st,amount){
  const mult=hasUpgrade(st,"combo2x")?2:1;
  st.xp+=amount*mult;
  st.xpTotal+=amount*mult;
  const needed=xpForLevel(st.level);
  while(st.xp>=needed){
    st.xp-=needed;
    st.level++;
    toast(`⬆️ Level ${st.level}! Commissioner rank increased!`);
    sfxLevelUp();
    checkUpgradeUnlocks(st);
  }
}
function xpForLevel(lv){return 20+lv*15;}
function xpPct(st){return Math.min(100,(st.xp/xpForLevel(st.level))*100);}

function checkUpgradeUnlocks(st){
  UPGRADES.forEach(u=>{
    if(!st.upgrades.includes(u.id)&&st.confs[st.player].prestige>=u.req){
      st.upgrades.push(u.id);
      u.effect(st);
      st.news.push({yr:st.year,txt:`⬆️ <b>Upgrade Unlocked:</b> ${u.name} — ${u.desc}`,cls:"good"});
      sfxLevelUp();
    }
  });
}

/* ============================================================
   MARCH MADNESS ENGINE
   ============================================================ */
function calcTeamPower(st,school){
  let pow=school.brand+(school.stars||0)*12+(school.mood-50)*0.3+rng()*20;
  if(hasUpgrade(st,"marchPow")&&school.conf===st.player)pow+=15;
  return pow;
}

function generateBracket(st){
  const allTeams=st.schools.filter(s=>s.conf!=="g5"&&!st.confs[s.conf].dead);
  allTeams.forEach(t=>{t._power=calcTeamPower(st,t);});
  allTeams.sort((a,b)=>b._power-a._power);

  const confBids={};
  for(const id of ALLC){
    if(st.confs[id].dead)continue;
    const m=members(st,id);
    const avgPow=m.reduce((a,s)=>a+(s.brand+(s.stars||0)*10),0)/Math.max(m.length,1);
    let bids=Math.min(m.length,Math.max(1,Math.round(avgPow/25)));
    if(P5.includes(id))bids=Math.max(bids,Math.min(8,Math.round(m.length*0.45)));
    confBids[id]=bids;
  }

  const field=[];const used=new Set();
  for(const id of ALLC){
    if(st.confs[id].dead)continue;
    const cm=members(st,id).filter(s=>!used.has(s.id));
    cm.sort((a,b)=>b._power-a._power);
    const take=Math.min(confBids[id]||1,cm.length);
    for(let i=0;i<take&&field.length<64;i++){field.push(cm[i]);used.add(cm[i].id);}
  }
  while(field.length<64){
    const next=allTeams.find(t=>!used.has(t.id));
    if(!next)break;
    field.push(next);used.add(next.id);
  }
  field.sort((a,b)=>b._power-a._power);
  field.forEach((t,i)=>{t._seed=i+1;});
  return field.slice(0,64);
}

function simGame(t1,t2){
  const p1=t1._power+rng()*25,p2=t2._power+rng()*25;
  const diff=Math.abs(p1-p2);
  const buzzer=diff<8&&rng()<0.22;
  const upset=t1._seed>t2._seed&&p1>p2||t2._seed>t1._seed&&p2>p1;
  const bigUpset=upset&&Math.abs(t1._seed-t2._seed)>8;
  const winner=p1>=p2?t1:t2;
  const loser=p1>=p2?t2:t1;
  const s1=55+Math.round(rng()*30),s2=s1-Math.round(diff*0.4+rng()*8);
  return {winner,loser,score:[p1>=p2?s1:s2,p1>=p2?s2:s1],buzzer,upset,bigUpset};
}

function runConferenceTourney(st){
  const m=members(st,st.player);
  if(m.length<4)return null;
  m.forEach(s=>{s._power=calcTeamPower(st,s);});
  m.sort((a,b)=>b._power-a._power);
  const field=m.slice(0,Math.min(12,m.length));
  field.forEach((t,i)=>{t._seed=i+1;});

  let current=[...field];
  const rounds=[];
  const roundNames=current.length>8?["First Round","Quarterfinals","Semifinals","Championship"]:current.length>4?["Quarterfinals","Semifinals","Championship"]:["Semifinals","Championship"];

  while(current.length>1){
    const results=[];
    for(let i=0;i<current.length;i+=2){
      if(i+1>=current.length){results.push({winner:current[i],loser:current[i],score:[0,0],buzzer:false,upset:false,bigUpset:false});continue;}
      results.push(simGame(current[i],current[i+1]));
    }
    rounds.push({name:roundNames[rounds.length]||"Round",games:results});
    current=results.map(g=>g.winner);
  }

  const champ=current[0];
  if(champ){
    champ.confTourneyWins=(champ.confTourneyWins||0)+1;
    st.confs[st.player].confTourneyChamp=champ.abbr;
    st.news.push({yr:st.year,txt:`🏀 <b>Conference Tournament Champion:</b> ${champ.name} wins the ${st.confs[st.player].name} tournament!`,cls:"good"});
    gainXP(st,3);
  }

  st.confTourneyResults.push({yr:st.year,champion:champ?.name||"",rounds:rounds.length});
  return {champion:champ,rounds};
}

function runTournament(st){
  const field=generateBracket(st);
  if(field.length<32)return null;

  const rounds=[];
  let current=field.slice(0,32);
  const roundNames=["Round of 32","Sweet 16","Elite 8","Final Four","Championship"];

  for(let r=0;r<5;r++){
    const results=[];
    for(let i=0;i<current.length;i+=2){
      if(i+1>=current.length)break;
      results.push(simGame(current[i],current[i+1]));
    }
    rounds.push({name:roundNames[r],games:results});
    current=results.map(g=>g.winner);
  }

  const champion=current[0];
  const playerConf=st.player;

  const myBids=field.filter(t=>t.conf===playerConf).length;
  const myFF=rounds.length>=4?rounds[3].games.filter(g=>g.winner.conf===playerConf||g.loser.conf===playerConf).length:0;
  const myChamp=champion&&champion.conf===playerConf?1:0;
  const myS16=rounds.length>=2?rounds[1].games.filter(g=>g.winner.conf===playerConf).length:0;
  const myE8=rounds.length>=3?rounds[2].games.filter(g=>g.winner.conf===playerConf).length:0;

  st.totalBids+=myBids;st.totalFF+=myFF;st.totalChamps+=myChamp;

  const pc=st.confs[playerConf];
  pc.marchBids+=myBids;
  if(myFF>0){pc.ffApps++;st.streak.ff++;}
  else st.streak.ff=0;
  if(myChamp>0){pc.titles++;st.titles++;st.streak.champ++;sfxCheer();sfxDrain();spawnConfetti();screenShake();}
  else st.streak.champ=0;
  st.longestStreak=Math.max(st.longestStreak,st.streak.ff);

  const comboGain=myBids+myS16*2+myE8*3+myFF*5+myChamp*10;
  st.combo+=comboGain;
  st.comboMax=Math.max(st.comboMax,st.combo);

  gainXP(st,myBids*2+myS16*3+myE8*5+myFF*8+myChamp*20);

  pc.prestige=Math.min(99,Math.max(5,pc.prestige+myChamp*8+myFF*3+myE8*1+myBids*0.5-2));

  const buzzers=rounds.flatMap(r=>r.games.filter(g=>g.buzzer&&(g.winner.conf===playerConf||g.loser.conf===playerConf)));
  const upsets=rounds.flatMap(r=>r.games.filter(g=>g.bigUpset&&g.winner.conf===playerConf));

  st.news.push({yr:st.year,txt:`🏆 <b>March Madness ${st.year}:</b> <b>${myBids} bids</b>. ${myFF>0?`<b>${myFF} Final Four</b>! `:""}${myChamp?`<b>${champion.name} wins the National Championship!</b>`:""} ${!myChamp&&myFF>0?"Best: Final Four.":""}${!myFF?`Best: ${myE8>0?"Elite 8":myS16>0?"Sweet 16":"Round of 32"}.`:""}`,cls:myChamp?"good":"madness"});

  if(buzzers.length>0){
    const bz=buzzers[0];
    st.news.push({yr:st.year,txt:`⏰ <b>Buzzer beater!</b> ${bz.winner.name} ${bz.score[0]}-${bz.score[1]} over ${bz.loser.name}!`,cls:"event"});
    sfxBuzzer();screenShake();
  }
  if(upsets.length>0){
    const up=upsets[0];
    st.news.push({yr:st.year,txt:`😱 <b>Cinderella!</b> #${up.winner._seed} ${up.winner.name} stuns #${up.loser._seed} ${up.loser.name}!`,cls:"event"});
  }

  // Resolve bets
  resolveBets(st,{bids:myBids,ff:myFF,champ:myChamp,champion:champion?.abbr});

  // Resolve prediction
  if(st.prediction){
    st.predictionTotal++;
    if(st.prediction===champion.abbr){
      st.predictionCorrect++;
      const reward=50+st.confs[st.player].prestige;
      st.nilBudget+=reward;
      st.news.push({yr:st.year,txt:`🔮 <b>PREDICTION CORRECT!</b> You called ${champion.name}! Won <b>${fmtM(reward)}</b>!`,cls:"bet"});
      sfxCoin();gainXP(st,15);
    } else {
      st.news.push({yr:st.year,txt:`🔮 Prediction miss. You picked ${st.schools.find(s=>s.abbr===st.prediction)?.name||st.prediction}, champ was ${champion.name}.`,cls:"event"});
    }
    st.prediction=null;
  }

  st.lastBracket={field:field.map(t=>({abbr:t.abbr,name:t.name,seed:t._seed,conf:t.conf,color:t.color})),rounds:rounds.map(r=>({name:r.name,games:r.games.map(g=>({w:g.winner.abbr,l:g.loser.abbr,score:g.score,buzzer:g.buzzer,upset:g.upset}))})),champion:champion.abbr,playerBids:myBids,playerFF:myFF,playerChamp:myChamp};
  st.tourneyResults.push({yr:st.year,bids:myBids,ff:myFF,champ:myChamp,champion:champion.name});

  checkAchievements(st);
  checkUpgradeUnlocks(st);
  return st.lastBracket;
}

function placeBet(st,type,amount,target){
  st.nilBudget-=amount;
  st.activeBets.push({type,amount,target,yr:st.year});
  st.news.push({yr:st.year,txt:`🎰 <b>Bet placed:</b> ${fmtM(amount)} on ${type==="bids"?target+"+ bids":type==="ff"?"Final Four appearance":type==="champ"?"championship":"??"}`,cls:"bet"});
  sfxCoin();
  renderAll();
}

function resolveBets(st,results){
  st.activeBets.forEach(bet=>{
    let won=false;
    let payout=0;
    if(bet.type==="bids"&&results.bids>=bet.target){won=true;payout=bet.amount*2.2;}
    else if(bet.type==="ff"&&results.ff>0){won=true;payout=bet.amount*3;}
    else if(bet.type==="champ"&&results.champ>0){won=true;payout=bet.amount*6;}

    if(won){
      st.nilBudget+=Math.round(payout);
      st.totalBetWon+=Math.round(payout)-bet.amount;
      st.news.push({yr:st.year,txt:`🎰 <b>BET WON!</b> ${bet.type} bet pays out <b>${fmtM(Math.round(payout))}</b>!`,cls:"bet"});
      sfxCoin();sfxCheer();gainXP(st,8);
    } else {
      st.totalBetLost+=bet.amount;
      st.news.push({yr:st.year,txt:`🎰 Bet lost: ${bet.type} bet (${fmtM(bet.amount)}).`,cls:"event"});
    }
    st.betHistory.push({...bet,won,payout:won?Math.round(payout):0});
  });
  st.activeBets=[];
}

/* ============================================================
   AI & SEASON ENGINE
   ============================================================ */
function aiTurns(st){
  for(const id of ALLC){
    if(id===st.player||st.confs[id].dead)continue;
    const c=st.confs[id];
    if(rng()<0.15+c.prestige*0.003){
      const targets=st.schools.filter(s=>s.conf!==id&&s.conf!=="g5"&&!st.confs[s.conf].dead&&s.brand>55);
      if(!targets.length)continue;
      targets.sort((a,b)=>b.brand-a.brand);
      const pick=targets[Math.floor(rng()*Math.min(5,targets.length))];
      const chance=acceptChance(st,pick,id);
      if(rng()*100<chance){
        if(pick.conf===st.player){
          st.queue.push({type:"raid",school:pick.id,raider:id,chance});
        } else {
          moveSchool(st,pick,id);
          if(st.confs[pick.orig])st.confs[pick.orig].wounded=2;
        }
      }
    }
  }
}

function seasonEcon(st){
  for(const id of ALLC){
    const c=st.confs[id];if(c.dead)continue;
    if(st.year>=c.tv.expires){
      let mv=mediaValue(st,id);
      const mult=0.85+rng()*0.35+(c.prestige/100)*0.3;
      if(hasUpgrade(st,"tvBonus")&&id===st.player)mv*=1.2;
      c.tv.rate=mv*mult;
      c.tv.len=3+Math.floor(rng()*5);
      c.tv.expires=st.year+c.tv.len;
      if(id===st.player){
        st.queue.push({type:"tvDeal",rate:c.tv.rate,len:c.tv.len});
      }
    }
    c.payout=payoutOf(st,id);
  }
}

function seasonMoods(st){
  for(const s of st.schools){
    if(s.conf==="g5")continue;
    const c=st.confs[s.conf];if(!c||c.dead)continue;
    const avgPay=ALLC.filter(id=>!st.confs[id].dead).reduce((a,id)=>a+payoutOf(st,id),0)/ALLC.filter(id=>!st.confs[id].dead).length;
    const payRatio=payoutOf(st,s.conf)/Math.max(1,avgPay);
    s.mood+=((payRatio-1)*8)+rng()*6-3;
    if(c.gor)s.mood-=rng()*2;
    if(s.tourney>0)s.mood+=3;
    if(hasUpgrade(st,"loyalty")&&s.conf===st.player)s.mood+=4;
    s.mood=Math.max(5,Math.min(95,s.mood));
    s.stars=Math.max(0,(s.stars||0)-1+Math.floor(rng()*2));
  }
}

function generateSeasonRecords(st){
  st.schools.forEach(s=>{
    if(s.conf==="g5"||st.confs[s.conf].dead)return;
    const pow=s.brand+(s.stars||0)*8+s.mood*0.2;
    const games=Math.round(28+rng()*6);
    const winPct=Math.min(0.95,Math.max(0.1,(pow/130)+rng()*0.2-0.1));
    s.wins=Math.round(games*winPct);
    s.losses=games-s.wins;
  });
}

function rankConfs(st){
  return ALLC.filter(id=>!st.confs[id].dead).sort((a,b)=>{
    const pa=st.confs[a].prestige,pb=st.confs[b].prestige;
    if(Math.abs(pa-pb)>5)return pb-pa;
    return payoutOf(st,b)-payoutOf(st,a);
  });
}

/* ============================================================
   SEASON FLOW
   ============================================================ */
function advance(){
  if(S.over)return;
  if(S.queue.length)return processQueue();
  initAudio();
  S.ap=S.baseAP||4;
  if(hasUpgrade(S,"ap5"))S.ap=5;
  S.vetoUsed=false;
  S.seasonsPlayed++;
  runSeason();
}

function runSeason(){
  generateSeasonRecords(S);
  yearEvents(S);
  aiTurns(S);
  if(S.queue.length)return processQueue();
  continueSeason();
}

function continueSeason(){
  seasonEcon(S);
  if(S.queue.length)return processQueue();
  finishSeason();
}

function finishSeason(){
  runConferenceTourney(S);
  const bracket=runTournament(S);
  seasonMoods(S);

  S.nilBudget+=Math.round(payoutOf(S,S.player)*0.3+S.confs[S.player].prestige*0.2);
  const streakBonus=Math.min(10,S.streak.ff*2);
  if(streakBonus>0){
    S.nilBudget+=streakBonus;
    if(streakBonus>=6)S.news.push({yr:S.year,txt:`🔥 <b>Streak bonus!</b> +${fmtM(streakBonus)} for ${S.streak.ff} consecutive Final Four appearances.`,cls:"money"});
  }

  gainXP(S,5);

  S.year++;
  if(S.year>=S.endYear||S.confs[S.player].dead){
    S.over=true;
    renderAll();
    showEndScreen();
    autoSave();
    return;
  }

  checkAchievements(S);
  checkUpgradeUnlocks(S);
  renderAll();
  autoSave();

  if(bracket){
    setTimeout(()=>showBracketModal(bracket),400);
  }
}

function processQueue(){
  if(!S.queue.length){continueSeason();return;}
  const item=S.queue.shift();
  if(item.type==="raid")showRaidModal(item);
  else if(item.type==="tvDeal")showTVDealModal(item);
  else if(item.type==="choice")showChoiceModal(item.data);
  else processQueue();
}

function autoSave(){
  if(!S)return;
  const data={...S,achievements:Array.from(S.achievements)};
  try{localStorage.setItem("hoopsWars_save",JSON.stringify(data));}catch(e){}
}

function spawnConfetti(){
  const canvas=$("confettiCanvas");
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const ctx=canvas.getContext("2d");
  const particles=[];
  const colors=["#f97316","#fbbf24","#4ade80","#60a5fa","#f472b6","#a78bfa","#ef4444"];
  for(let i=0;i<180;i++){
    particles.push({x:canvas.width*rng(),y:-20-rng()*200,vx:rng()*4-2,vy:2+rng()*4,
      w:4+rng()*6,h:8+rng()*10,color:colors[Math.floor(rng()*colors.length)],
      rot:rng()*360,rotV:rng()*10-5,life:1});
  }
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=0;
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.rot+=p.rotV;p.life-=0.005;
      if(p.life<=0||p.y>canvas.height+50)return;alive++;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    frame++;
    if(alive>0&&frame<300)requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

function renderMap(){

  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("transform",`translate(${mapPanX},${mapPanY}) scale(${mapZoom})`);

  const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
  defs.innerHTML=`
    <radialGradient id="oceanGrad" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#111830"/><stop offset="100%" stop-color="#090c16"/></radialGradient>
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="${S.confs[S.player].hex}" flood-opacity="0.8"/></filter>
    <filter id="landShadow"><feDropShadow dx="1" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter>`;
  svg.appendChild(defs);

  const ocean=document.createElementNS("http://www.w3.org/2000/svg","rect");
  ocean.setAttribute("width","970");ocean.setAttribute("height","580");
  ocean.setAttribute("fill","url(#oceanGrad)");g.appendChild(ocean);

  let path="M";
  OUTLINE.forEach((p,i)=>{const[x,y]=proj(p[0],p[1]);path+=(i?" L":"")+x.toFixed(1)+","+y.toFixed(1);});
  path+="Z";
  const land=document.createElementNS("http://www.w3.org/2000/svg","path");
  land.setAttribute("d",path);land.setAttribute("fill","#161e30");
  land.setAttribute("stroke","#2a3a5a");land.setAttribute("stroke-width","1.8");
  land.setAttribute("filter","url(#landShadow)");g.appendChild(land);

  LAKES.forEach(lake=>{
    let lp="M";
    lake.forEach((p,i)=>{const[x,y]=proj(p[0],p[1]);lp+=(i?" L":"")+x.toFixed(1)+","+y.toFixed(1);});
    lp+="Z";
    const lk=document.createElementNS("http://www.w3.org/2000/svg","path");
    lk.setAttribute("d",lp);lk.setAttribute("fill","#0c1020");
    lk.setAttribute("stroke","#1a2844");lk.setAttribute("stroke-width","0.8");g.appendChild(lk);
  });

  STATE_BORDERS.forEach(border=>{
    let bp="M";
    border.forEach((p,i)=>{const[x,y]=proj(p[0],p[1]);bp+=(i?" L":"")+x.toFixed(1)+","+y.toFixed(1);});
    const line=document.createElementNS("http://www.w3.org/2000/svg","path");
    line.setAttribute("d",bp);line.setAttribute("fill","none");
    line.setAttribute("stroke","#1e2a44");line.setAttribute("stroke-width","0.5");
    line.setAttribute("stroke-dasharray","4 3");line.setAttribute("opacity","0.6");g.appendChild(line);
  });

  for(const id of ALLC){
    if(S.confs[id].dead)continue;
    const m=members(S,id);if(m.length<3)continue;
    const pts=m.map(s=>proj(s.lat,s.lon));
    const hull=convexHull(pts);if(hull.length<3)continue;
    const cx=hull.reduce((a,p)=>a+p[0],0)/hull.length;
    const cy=hull.reduce((a,p)=>a+p[1],0)/hull.length;
    const expanded=hull.map(p=>[cx+(p[0]-cx)*1.3,cy+(p[1]-cy)*1.3]);
    let hp="M"+expanded.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L")+"Z";
    const isMe=id===S.player;
    const isHi=mapHighlight===id;
    const isWar=id===S.warTarget;
    const hullEl=document.createElementNS("http://www.w3.org/2000/svg","path");
    hullEl.setAttribute("d",hp);hullEl.setAttribute("fill",isWar?"#ff000022":S.confs[id].hex);
    hullEl.setAttribute("fill-opacity",isMe?"0.14":isHi?"0.12":"0.04");
    hullEl.setAttribute("stroke",isWar?"#ff4444":S.confs[id].hex);
    hullEl.setAttribute("stroke-opacity",isMe?"0.35":isHi?"0.3":"0.1");
    hullEl.setAttribute("stroke-width",isWar?"2.5":"1.5");
    if(isWar)hullEl.setAttribute("stroke-dasharray","6 4");
    g.appendChild(hullEl);
  }

  const sortedSchools=[...S.schools].sort((a,b)=>(a.conf===S.player?1:0)-(b.conf===S.player?1:0));
  sortedSchools.forEach(s=>{
    if(s.conf==="g5")return;
    if(mapHighlight&&s.conf!==mapHighlight&&s.conf!==S.player)return;
    const[x,y]=proj(s.lat,s.lon);
    const r=Math.max(3,2.5+s.brand*0.065);
    const mine=s.conf===S.player;
    const c=S.confs[s.conf];
    const fill=s.color||"#888";
    const stroke=mine?S.confs[S.player].hex:(c?c.hex:"#555");

    if(mine){
      const halo=document.createElementNS("http://www.w3.org/2000/svg","circle");
      halo.setAttribute("cx",x.toFixed(1));halo.setAttribute("cy",y.toFixed(1));
      halo.setAttribute("r",(r+4).toFixed(1));halo.setAttribute("fill","none");
      halo.setAttribute("stroke","#ffffff");halo.setAttribute("stroke-width","0.8");
      halo.setAttribute("opacity","0.25");g.appendChild(halo);
    }

    const circle=document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx",x.toFixed(1));circle.setAttribute("cy",y.toFixed(1));
    circle.setAttribute("r",r.toFixed(1));circle.setAttribute("fill",fill);
    circle.setAttribute("stroke",stroke);circle.setAttribute("stroke-width",mine?"2.5":"1.2");
    if(mine)circle.setAttribute("filter","url(#glow)");
    circle.classList.add("dot");
    circle.addEventListener("mouseenter",e=>showTip(e,s));
    circle.addEventListener("mouseleave",()=>{$("tip").style.display="none";});
    g.appendChild(circle);

    if(s.stars&&s.stars>=3){
      const star=document.createElementNS("http://www.w3.org/2000/svg","text");
      star.setAttribute("x",(x+r+2).toFixed(1));star.setAttribute("y",(y-r).toFixed(1));
      star.setAttribute("font-size","8");star.setAttribute("fill","#fbbf24");
      star.textContent="★";g.appendChild(star);
    }
  });

  svg.appendChild(g);

  svg.addEventListener("wheel",e=>{
    e.preventDefault();
    const delta=e.deltaY>0?0.9:1.1;
    mapZoom=Math.max(0.8,Math.min(4,mapZoom*delta));
    renderMap();
  },{passive:false});
  svg.addEventListener("mousedown",e=>{mapDragging=true;mapDragStart={x:e.clientX-mapPanX,y:e.clientY-mapPanY};svg.classList.add("dragging");});
  svg.addEventListener("mousemove",e=>{if(!mapDragging||!mapDragStart)return;mapPanX=e.clientX-mapDragStart.x;mapPanY=e.clientY-mapDragStart.y;g.setAttribute("transform",`translate(${mapPanX},${mapPanY}) scale(${mapZoom})`);});
  svg.addEventListener("mouseup",()=>{mapDragging=false;svg.classList.remove("dragging");});
  svg.addEventListener("mouseleave",()=>{mapDragging=false;svg.classList.remove("dragging");});

  const existing=panel.querySelector("svg");
  if(existing)existing.remove();
  panel.appendChild(svg);

  if(!panel.querySelector("#zoomCtl")){
    const zc=document.createElement("div");zc.id="zoomCtl";
    zc.innerHTML=`<button class="zbtn" onclick="mapZoom=Math.min(4,mapZoom*1.3);renderMap()">+</button><button class="zbtn" onclick="mapZoom=Math.max(.8,mapZoom*.7);renderMap()">−</button><button class="zbtn" onclick="mapZoom=1;mapPanX=0;mapPanY=0;renderMap()">⟲</button>`;
    panel.appendChild(zc);
  }

  let legendEl=panel.querySelector("#legend");
  if(!legendEl){legendEl=document.createElement("div");legendEl.id="legend";panel.appendChild(legendEl);}
  legendEl.innerHTML=ALLC.filter(id=>!S.confs[id].dead).map(id=>{
    const c=S.confs[id];const active=mapHighlight===id?"active":"";
    const war=id===S.warTarget?"⚔️ ":"";
    return `<span class="lg ${active}" onclick="mapHighlight=mapHighlight==='${id}'?null:'${id}';renderMap()"><i style="background:${c.hex}"></i>${war}${c.name}</span>`;
  }).join("");
}

function showTargetPicker(st,targets){

function attemptCourt(schoolId){
  const s=S.schools[schoolId];
  const chance=acceptChance(S,s,S.player);
  S.ap--;s.lastCourt=S.year;
  hideModal();
  if(rng()*100<chance){
    moveSchool(S,s,S.player);
    toast(`✅ ${s.name} joins your conference!`);
    sfxSwish();
    const cGain=hasUpgrade(S,"combo2x")?6:3;
    S.combo+=cGain;
    gainXP(S,6);
  } else {
    toast(`❌ ${s.name} declined your offer.`);
    S.combo=Math.max(0,S.combo-1);
    sfxFail();
  }
  checkAchievements(S);
  renderAll();
}

function doNIL(amount){
  if(S.nilBudget<amount)return toast("Not enough funds!");
  S.nilBudget-=amount;S.ap--;
  const m=members(S,S.player);
  const stars=Math.ceil(amount/5);
  for(let i=0;i<stars;i++){
    const pick=m[Math.floor(rng()*m.length)];
    if(pick)pick.stars=(pick.stars||0)+1;
  }
  hideModal();
  toast(`⭐ ${stars} stars distributed!`);
  sfxSwish();S.combo+=stars;gainXP(S,stars);
  renderAll();
}

  const html=`<h2>🚨 Raid Alert!</h2>
    <div class="sub">The ${raider.name} is courting <b>${s.name}</b>!</div>
    <div class="body"><p><b style="color:${s.color}">${s.name}</b> (Brand: ${Math.round(s.brand)}, Mood: ${Math.round(s.mood)}%) is being courted by <b style="color:${raider.hex}">${raider.name}</b>.</p>
    <p>Chance they leave: <span style="color:var(--red);font-weight:900">${item.chance}%</span></p></div>
    <div class="btnRow">
      <button class="btn-cta" onclick="counterRaid(${item.school},'retain')">Retain ($5M + mood)</button>
      ${canVeto?`<button class="btn-purple" onclick="counterRaid(${item.school},'veto')">🛡️ Veto (Free)</button>`:""}
      <button class="btn-ghost" onclick="counterRaid(${item.school},'let')">Let Them Go</button>
    </div>`;
  showModal(html);
}

function counterRaid(schoolId,action){
  const s=S.schools[schoolId];
  hideModal();
  if(action==="veto"){
    S.vetoUsed=true;
    s.mood=Math.min(85,s.mood+10);
    toast(`🛡️ Commissioner's Veto! ${s.name} stays!`);
    sfxSwish();S.combo+=3;gainXP(S,5);
  } else if(action==="retain"){
    S.nilBudget=Math.max(0,S.nilBudget-5);
    s.mood=Math.min(85,s.mood+20);
    toast(`🤝 Convinced ${s.name} to stay!`);
    S.combo+=2;gainXP(S,3);
  } else {
    if(rng()*100<50){
      moveSchool(S,s,S.queue.find(q=>q.school===schoolId)?.raider||"g5");
      toast(`💔 ${s.name} has left.`);
      S.combo=0;sfxFail();
    } else {
      toast(`${s.name} decided to stay!`);
      gainXP(S,2);
    }
  }
  renderAll();
  processQueue();
}

function showTVDealModal(item){
  const c=S.confs[S.player];
  let mv=mediaValue(S,S.player);
  if(hasUpgrade(S,"tvBonus"))mv*=1.2;
  const html=`<h2>📺 TV Deal Expired!</h2>

      <button class="btn-gold" onclick="signDeal(${mv*1.15},3)">Short (3yr) ${fmtM(mv*1.15)}</button>

}

function signDeal(rate,len){

  hideModal();
  S.news.push({yr:S.year,txt:`📺 <b>${len}-year TV deal</b> worth <b>${fmtM(rate)}</b>.`,cls:"money"});
  sfxCoin();renderAll();processQueue();
}

function showChoiceModal(data){
  const html=`<h2>${data.title}</h2><div class="sub">${data.desc}</div>
    <div class="btnRow">${data.opts.map((o,i)=>`<button class="${i===0?"btn-cta":"btn-ghost"}" onclick="doChoice(${i})">${o.label}</button>`).join("")}</div>`;

  window._choiceOpts=data.opts;
}

function doChoice(i){
  window._choiceOpts[i].fx();hideModal();renderAll();processQueue();
}

function showMemberModal(id){
  const s=S.schools[id];
  const html=`<h2 style="color:${s.color}">${s.name}</h2>
    <div class="sub">${S.confs[s.conf]?.name||"Independent"}</div>

/* ============================================================
   BRACKET MODAL
   ============================================================ */
function showBracketModal(bracket){
  if(!bracket)return;
  const playerConf=S.player;

  let html=`<h2>🏀 March Madness ${S.year-1}</h2>
    <div class="sub"><b>${bracket.playerBids} bids</b> | FF: <b>${bracket.playerFF}</b> | Champ: <b style="color:var(--gold)">${bracket.champion}</b></div>
    <div class="bracket-wrap">`;

  bracket.rounds.forEach((round,ri)=>{
    html+=`<div class="bracket-round"><div class="round-label">${round.name}</div>`;
    round.games.forEach(g=>{
      const wSchool=bracket.field.find(t=>t.abbr===g.w);
      const lSchool=bracket.field.find(t=>t.abbr===g.l);
      const wMine=wSchool&&wSchool.conf===playerConf;
      const lMine=lSchool&&lSchool.conf===playerConf;
      html+=`<div class="bracket-match${g.buzzer?" buzzer":""}">
        <div class="team winner${wMine?" mine":""}"><span class="seed">${wSchool?wSchool.seed:""}</span><span style="color:${wSchool?.color||"#fff"}">${g.w}</span><span>${g.score[0]}</span></div>
        <div class="team${lMine?" mine":""}"><span class="seed">${lSchool?lSchool.seed:""}</span><span style="color:${lSchool?.color||"#888"}">${g.l}</span><span>${g.score[1]}</span></div>
      </div>`;
    });
    html+=`</div>`;
  });

  html+=`</div>`;

  if(bracket.playerChamp>0){
    html+=`<div style="text-align:center;margin-top:10px"><span style="font-size:32px">🏆</span><div style="font-size:16px;font-weight:900;color:var(--gold)">YOUR CONFERENCE WINS THE NATIONAL CHAMPIONSHIP!</div></div>`;
  }

  html+=`<div class="btnRow"><button class="btn-cta" onclick="hideModal()">Continue</button></div>`;
  showModal(html);
}

   START SCREEN

  const hasSave=!!localStorage.getItem("hoopsWars_save");
  const html=`
    <div style="text-align:center;margin-bottom:18px">
      <div style="font-size:44px">🏀</div>
      <h2 style="font-size:26px;letter-spacing:2px"><span style="color:var(--ora)">HOOPS</span> WARS</h2>
      <div class="sub" style="font-size:13px">Basketball Conference Tycoon</div>
      <p style="color:var(--dim);font-size:12px;max-width:420px;margin:0 auto;line-height:1.55">
        Run a college basketball conference through 30 years of March Madness, NIL money, TV deals, betting, wars, and betrayal.
        Court schools, build a dynasty, unlock upgrades, dominate the bracket.
      </p>
    </div>
    ${hasSave?`<div style="text-align:center;margin-bottom:14px"><button class="btn-green" onclick="resumeGame()" style="font-size:15px;padding:12px 28px">▶ CONTINUE SAVED GAME</button></div>`:""}
    <div class="secLbl" style="margin-bottom:6px">New Game — Choose Conference</div>
    <div class="pickGrid">
      ${ALLC.map(id=>{
        const c=CONF_META[id];const m=SCHOOL_ROWS.filter(r=>r[2]===id);

        return `<div class="pick" onclick="startGame('${id}')">
          <div class="nm"><i style="background:${c.hex}"></i>${c.name}</div>
          <div class="meta">${m.length} schools · ${c.blurb.slice(0,70)}...</div>
          <div class="diff ${df}">${df==="easy"?"EASY":df==="med"?"MEDIUM":df==="hard"?"HARD":"EXTREME"}</div>
        </div>`;
      }).join("")}
    </div>
    <div style="text-align:center;margin-top:14px;display:flex;gap:8px;justify-content:center">
      <button class="btn-gold" onclick="startDaily()">📅 Daily Challenge</button>
      ${hasSave?`<button class="btn-red btn-sm" onclick="if(confirm('Delete saved game?')){deleteSave();showStartScreen();}">🗑️ Delete Save</button>`:""}

}

function startGame(conf){
  rng=Math.random;
  S=newState(conf);
  hideModal();
  renderAll();
  S.news.push({yr:S.year,txt:`🏀 <b>Welcome, Commissioner.</b> You lead the <b>${S.confs[conf].name}</b>. Build a dynasty. Dominate March. Make history.`,cls:"good"});
  S.news.push({yr:S.year,txt:`💡 <b>Tip:</b> Place bets, predict champions, and declare wars for extra rewards! Upgrades unlock with prestige.`,cls:"event"});
  renderAll();
}

function resumeGame(){
  const data=loadGame();
  if(!data){toast("No save found!");return;}
  S=data;
  hideModal();
  renderAll();
  toast("📂 Game loaded! Season "+S.year);
}

function startDaily(){
  const today=new Date();
  const seed=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();
  rng=mulberry32(seed);
  const conf=ALLC[Math.floor(rng()*ALLC.length)];
  S=newState(conf);
  S.dailySeed=seed;
  hideModal();
  renderAll();
  S.news.push({yr:S.year,txt:`📅 <b>Daily Challenge:</b> You are the <b>${S.confs[conf].name}</b> commissioner. Same scenario for everyone today!`,cls:"event"});
  renderAll();
}

/* ============================================================
   END SCREEN & SCORING
   ============================================================ */
function finalScore(){
  const st=S;
  let money=0;
  const ranks=rankConfs(st);
  const rank=ranks.indexOf(st.player)+1;
  money+=Math.max(0,40-rank*4);
  money+=Math.min(25,payoutOf(st,st.player)*3);
  const brandGrowth=confBrand(st,st.player)-st.brandStart;
  money+=Math.min(15,brandGrowth*0.5);
  money+=Math.min(20,st.titles*7);
  money+=Math.min(10,st.totalBetWon*0.05);
  return Math.max(0,Math.min(100,Math.round(money)));
}

function soulScore(){
  const st=S;
  let soul=0;
  const avgMood=members(st,st.player).reduce((a,s)=>a+s.mood,0)/Math.max(1,members(st,st.player).length);
  soul+=Math.min(35,avgMood*0.4);
  const origKept=st.schools.filter(s=>s.conf===st.player&&s.orig===st.player).length;
  const origTotal=st.schools.filter(s=>s.orig===st.player).length;
  soul+=Math.min(25,(origKept/Math.max(1,origTotal))*25);
  soul+=Math.min(20,st.totalBids*0.4);
  soul+=Math.min(20,Math.round(st.confs[st.player].prestige*0.2));
  soul-=st.expels*5;
  soul+=Math.min(10,st.predictionCorrect*4);
  return Math.max(0,Math.min(100,Math.round(soul)));
}

function letterGrade(score){
  if(score>=95)return"S";if(score>=88)return"A+";if(score>=80)return"A";
  if(score>=72)return"B+";if(score>=64)return"B";if(score>=55)return"C+";
  if(score>=45)return"C";if(score>=30)return"D";return"F";
}
function gradeColor(g){
  if(g==="S")return"#f97316";if(g.startsWith("A"))return"#4ade80";
  if(g.startsWith("B"))return"#fbbf24";if(g.startsWith("C"))return"#60a5fa";
  return"#f87171";
}

function showEndScreen(){
  const ms=finalScore(),ss=soulScore();
  const mg=letterGrade(ms),sg=letterGrade(ss);

  const badges=BADGES.filter(b=>S.achievements.has(b.id));
  const totalChamps=S.totalChamps;

  const epilogue=totalChamps>=5?"You built an empire that will echo through the ages. Gold standard of college hoops.":
    totalChamps>=2?"Multiple championships define your legacy. A March Madness powerhouse.":
    totalChamps>=1?"A national championship crowns a successful tenure.":
    S.totalFF>=5?"Final Four consistency shows excellence, even without the ultimate prize.":
    S.confs[S.player].dead?"Your conference collapsed. The basketball world moved on.":
    "Thirty years, countless games, one story. Your conference survived.";

  const html=`
    <div style="text-align:center;margin-bottom:14px"><span style="font-size:44px">🏀</span>
    <h2>THE FINAL BUZZER</h2><div class="sub">${S.confs[S.player].name} · ${S.startYear}–${S.year}</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0">
      <div style="text-align:center">
        <div class="secLbl">Money Grade</div>
        <div class="grade gradeStamp" style="color:${gradeColor(mg)}">${mg}</div>
        <div style="color:var(--dim);font-size:11px">${ms}/100</div>
      </div>
      <div style="text-align:center">
        <div class="secLbl">Legacy Grade</div>
        <div class="grade gradeStamp" style="color:${gradeColor(sg)};animation-delay:.4s">${sg}</div>
        <div style="color:var(--dim);font-size:11px">${ss}/100</div>
      </div>
    </div>
    <div class="recap"><p>${epilogue}</p>
      <p style="margin-top:6px"><b>March:</b> ${S.totalBids} bids · ${S.totalFF} FF · ${S.totalChamps} Titles</p>
      <p><b>Conference:</b> ${members(S,S.player).length} members · Prestige: ${Math.round(S.confs[S.player].prestige)} · Payout: ${fmtM(payoutOf(S,S.player))}</p>
      <p><b>Combo:</b> ${S.comboMax} · <b>Poached:</b> ${S.moves.filter(m=>m.to===S.player).length} · <b>Lost:</b> ${S.moves.filter(m=>m.from===S.player).length}</p>
      <p><b>Level:</b> ${S.level} · <b>Bets Won:</b> ${fmtM(S.totalBetWon)} · <b>Predictions:</b> ${S.predictionCorrect}/${S.predictionTotal}</p>
      <p><b>Upgrades:</b> ${S.upgrades.length}/${UPGRADES.length}</p>
    </div>
    ${badges.length?`<div class="secLbl">Achievements (${badges.length}/${BADGES.length})</div><div style="margin-top:6px">${badges.map(b=>`<span class="badge earned" title="${b.desc}">${b.name}</span>`).join("")}</div>`:""}
    <div class="btnRow" style="margin-top:16px">
      <button class="btn-cta" onclick="deleteSave();showStartScreen()">Play Again</button>
      <button class="btn-ghost" onclick="hideModal()">View Final State</button>
    </div>`;
  showModal(html);
  if(totalChamps>0)spawnConfetti();
}

/* ============================================================
   TOAST & KEYBOARD & INIT
   ============================================================ */
function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.add("on");
  clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove("on"),2800);
}

document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&!S?.over&&$("shade").style.display!=="flex"){e.preventDefault();advance();}
  if(e.code==="Escape")hideModal();
  if(e.code==="KeyS"&&(e.ctrlKey||e.metaKey)){e.preventDefault();saveGame();}
});

window.addEventListener("load",()=>{
  renderAll();
  showStartScreen();
});

window.addEventListener("beforeunload",()=>{
  if(S&&!S.over)autoSave();
});
</script>
